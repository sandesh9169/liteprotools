<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Crop · with border color & width</title>
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-purple: #7c3aed;
            --light-purple-bg: #f3f0ff;
            --border-purple: #d8b4fe;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --btn-shadow: 0 4px 6px -1px rgba(124, 58, 237, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            background-image: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--text-dark);
        }

        /* ---------- HOME BUTTON ---------- */
        .home-btn-wrapper {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            color: var(--primary-purple);
            border: 2px solid var(--border-purple);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(124, 58, 237, 0.15);
        }

        .home-btn:hover {
            background: var(--primary-purple);
            color: white;
            border-color: var(--primary-purple);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.35);
        }

        .home-btn i {
            font-size: 15px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        .page-header h1 {
            font-size: 28px;
            color: var(--text-dark);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .page-header p.subtitle {
            color: var(--text-light);
            font-size: 15px;
            background: white;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .main-card {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05), 0 0 0 1px rgba(124, 58, 237, 0.1);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .upload-box {
            border: 2px dashed var(--border-purple);
            background-color: #faf5ff;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .upload-box:hover {
            background-color: #f3e8ff;
            border-color: var(--primary-purple);
        }

        .upload-box input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .folder-icon {
            font-size: 48px;
            color: var(--primary-purple);
            margin-bottom: 15px;
            display: block;
        }

        .upload-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .upload-subtitle {
            font-size: 14px;
            color: var(--text-light);
            background: white;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
        }

        .crop-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .hidden {
            display: none !important;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 350px;
            overflow: hidden;
            background-color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            border: 2px solid var(--border-purple);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        .circle-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 10;
        }

        .circle-overlay::before,
        .circle-overlay::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.4);
        }
        .circle-overlay::before {
            top: 50%; left: 0; width: 100%; height: 1px;
            transform: translateY(-50%);
        }
        .circle-overlay::after {
            top: 0; left: 50%; width: 1px; height: 100%;
            transform: translateX(-50%);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: #f8fafc;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .control-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-purple);
            cursor: pointer;
        }

        .border-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            background-color: #f8fafc;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            align-items: center;
            justify-content: space-between;
        }

        .border-controls label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
        }

        .border-controls input[type="color"] {
            width: 42px;
            height: 36px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            padding: 2px;
        }

        .border-controls input[type="number"] {
            width: 70px;
            padding: 8px 6px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            background: white;
        }

        .border-controls input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .border-controls input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 6px;
        }

        .tip {
            font-size: 13px;
            color: var(--text-light);
            text-align: center;
            background: #f8fafc;
            padding: 10px;
            border-radius: 12px;
            width: 100%;
        }

        .tip i {
            color: var(--primary-purple);
            margin-right: 5px;
        }

        #download-btn {
            width: 100%;
            padding: 14px 30px;
            background-color: var(--primary-purple);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            box-shadow: var(--btn-shadow);
        }

        #download-btn:hover {
            background-color: #6d28d9;
            transform: translateY(-2px);
        }

        #download-btn:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: var(--primary-purple);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        @media (max-width: 500px) {
            body { padding-top: 70px; }
            .home-btn-wrapper { top: 12px; right: 12px; }
            .home-btn { padding: 8px 16px; font-size: 13px; }
            .main-card { padding: 20px; }
            .page-header h1 { font-size: 22px; }
            .canvas-wrapper { height: 300px; }
        }
    </style>
</head>
<body>

    <!-- HOME BUTTON -->
    <div class="home-btn-wrapper">
        <a href="index.html" class="home-btn">
            <i class="fas fa-home"></i> Home
        </a>
    </div>

    <div class="page-header">
        <h1>Circle Crop Your Images Online</h1>
        <p class="subtitle">Upload an image and crop it into a perfect circle</p>
    </div>

    <div class="main-card">
        
        <div id="upload-section" class="upload-box">
            <div class="folder-icon">
                <i class="fas fa-cloud-upload-alt"></i>
            </div>
            <div class="upload-title">Drop image here or click</div>
            <div class="upload-subtitle">.jpg, .png, .jpeg allowed</div>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div id="crop-section" class="crop-container hidden">
            <div class="canvas-wrapper">
                <canvas id="image-canvas"></canvas>
                <div class="circle-overlay"></div>
            </div>

            <div class="controls">
                <div class="control-row">
                    <label for="aspect-ratio">Maintain Aspect Ratio</label>
                    <input type="checkbox" id="aspect-ratio" checked>
                </div>

                <div class="border-controls">
                    <label for="image-border">
                        <input type="checkbox" id="image-border">
                        Border
                    </label>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 13px;">Color</span>
                        <input type="color" id="border-color" value="#ffffff">
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 13px;">Width(px)</span>
                        <input type="number" id="border-width" value="10" min="1" max="200" step="1">
                    </div>
                </div>

                <p class="tip"><i class="fas fa-mouse"></i> Tip: Scroll Mouse Wheel For Zoom In & Zoom Out</p>
                <button id="download-btn">
                    <i class="fas fa-download"></i> Download Cropped Image
                </button>
            </div>
        </div>
    </div>

    <div class="footer">
        <i class="fa-solid fa-heart"></i> Made with Love · Create by Sandesh <i class="fa-solid fa-heart"></i>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const uploadSection = document.getElementById('upload-section');
        const cropSection = document.getElementById('crop-section');
        const canvas = document.getElementById('image-canvas');
        const ctx = canvas.getContext('2d');
        const aspectRatioCheckbox = document.getElementById('aspect-ratio');
        const borderCheckbox = document.getElementById('image-border');
        const borderColorPicker = document.getElementById('border-color');
        const borderWidthInput = document.getElementById('border-width');
        const downloadBtn = document.getElementById('download-btn');

        let img = new Image();
        let imgX = 0, imgY = 0;
        let scale = 1;
        let isDragging = false;
        let startX, startY;

        const canvasWidth = 350;
        const canvasHeight = 350;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        const circleSize = 200;
        const circleRadius = circleSize / 2;

        // --- 1. Handle Image Upload ---
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    img.src = event.target.result;
                    img.onload = () => {
                        uploadSection.classList.add('hidden');
                        cropSection.classList.remove('hidden');
                        resetImagePosition();
                        drawImage();
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        // --- 2. Reset Image Position ---
        function resetImagePosition() {
            const scaleX = canvasWidth / img.width;
            const scaleY = canvasHeight / img.height;
            scale = Math.max(scaleX, scaleY);
            imgX = (canvasWidth - img.width * scale) / 2;
            imgY = (canvasHeight - img.height * scale) / 2;
        }

        // --- 3. Draw Image ---
        function drawImage() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            ctx.drawImage(img, imgX, imgY, img.width * scale, img.height * scale);
        }

        // --- 4. Drag (Mouse + Touch) ---
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - imgX;
            startY = e.clientY - imgY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            imgX = e.clientX - startX;
            imgY = e.clientY - startY;
            drawImage();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            const touch = e.touches[0];
            startX = touch.clientX - imgX;
            startY = touch.clientY - imgY;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const touch = e.touches[0];
            imgX = touch.clientX - startX;
            imgY = touch.clientY - startY;
            drawImage();
        }, { passive: false });

        window.addEventListener('touchend', () => { isDragging = false; });

        // --- 5. Zoom (Mouse Wheel) ---
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.1;
            const wheel = e.deltaY < 0 ? 1 : -1;
            const zoomFactor = Math.exp(wheel * zoomIntensity);

            const mouseX = e.offsetX;
            const mouseY = e.offsetY;

            const newScale = scale * zoomFactor;
            if (newScale < 0.2 || newScale > 10) return;

            imgX = mouseX - (mouseX - imgX) * zoomFactor;
            imgY = mouseY - (mouseY - imgY) * zoomFactor;
            scale = newScale;

            drawImage();
        });

        // --- 6. Aspect Ratio (1:1 fixed) ---
        aspectRatioCheckbox.addEventListener('change', () => {
            if (!aspectRatioCheckbox.checked) {
                alert("Note: This tool crops in a fixed 1:1 Circle format.");
                aspectRatioCheckbox.checked = true;
            }
        });

        // --- 7. Download Cropped Image (FINAL FIX) ---
        downloadBtn.addEventListener('click', () => {
            const outputSize = 500;

            const previewCanvas = document.createElement('canvas');
            previewCanvas.width = canvasWidth;
            previewCanvas.height = canvasHeight;
            const previewCtx = previewCanvas.getContext('2d');
            previewCtx.drawImage(
                img,
                imgX,
                imgY,
                img.width * scale,
                img.height * scale
            );

            const circleLeft = (canvasWidth / 2) - circleRadius;
            const circleTop  = (canvasHeight / 2) - circleRadius;

            const outCanvas = document.createElement('canvas');
            outCanvas.width = outputSize;
            outCanvas.height = outputSize;
            const outCtx = outCanvas.getContext('2d');

            outCtx.beginPath();
            outCtx.arc(outputSize / 2, outputSize / 2, outputSize / 2, 0, Math.PI * 2);
            outCtx.closePath();
            outCtx.clip();

            outCtx.drawImage(
                previewCanvas,
                circleLeft,
                circleTop,
                circleSize,
                circleSize,
                0,
                0,
                outputSize,
                outputSize
            );

            if (borderCheckbox.checked) {
                const borderColor = borderColorPicker.value;
                let bw = parseFloat(borderWidthInput.value);
                if (isNaN(bw) || bw <= 0) bw = 10;

                const strokeRadius = (outputSize / 2) - (bw / 2);

                outCtx.save();
                outCtx.strokeStyle = borderColor;
                outCtx.lineWidth = bw;
                outCtx.beginPath();
                outCtx.arc(outputSize / 2, outputSize / 2, strokeRadius, 0, Math.PI * 2);
                outCtx.stroke();
                outCtx.restore();
            }

            const dataURL = outCanvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'circle-cropped-image.png';
            link.href = dataURL;
            link.click();
        });
    </script>
</body>
</html>
