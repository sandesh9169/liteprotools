<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>file to ZIP - ZipLoved</title>
    <!-- ✅ FAVICON - Folder ke andar wali files -->
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
        }

        html, body { min-height: 100%; }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f8f0ff 0%, #f0e6ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* ---------- HOME BUTTON ---------- */
        .home-btn-wrapper {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1500;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            color: #6a3de8;
            border: 2px solid #d9c8ff;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 16px rgba(106, 61, 232, 0.15);
        }

        .home-btn:hover {
            background: linear-gradient(135deg, #6a3de8, #a884ff);
            color: white;
            border-color: #6a3de8;
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(106, 61, 232, 0.4);
        }

        .home-btn i { font-size: 15px; }

        /* ---------- PAGE SHELL ---------- */
        .page-shell {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .card {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 56px 56px 48px 48px;
            padding: 2.4rem 2.5rem 2.8rem;
            box-shadow: 0 30px 60px -15px rgba(90, 40, 140, 0.25),
                        0 0 0 1px rgba(200, 170, 255, 0.25) inset;
            border: 1px solid rgba(220, 200, 255, 0.4);
            transition: all 0.2s ease;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.8rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .brand i {
            font-size: 2.4rem;
            color: #6a3de8;
            filter: drop-shadow(0 4px 8px rgba(106, 61, 232, 0.2));
        }

        .brand h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #2c1a4e;
            letter-spacing: -0.3px;
        }

        .brand h1 small {
            font-size: 0.8rem;
            font-weight: 400;
            background: #ede4ff;
            padding: 0.2rem 1rem;
            border-radius: 60px;
            color: #5b3b9e;
            margin-left: 0.3rem;
        }

        .header-badge {
            background: white;
            border: 1px solid #d9c8ff;
            padding: 0.4rem 1.4rem;
            border-radius: 80px;
            font-weight: 600;
            color: #3b1f7a;
            box-shadow: 0 6px 16px rgba(106, 61, 232, 0.08);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.9rem;
        }

        .header-badge i { color: #6a3de8; }

        /* drop zone */
        .drop-zone {
            background: rgba(245, 238, 255, 0.6);
            border: 2px dashed #c9b0ff;
            border-radius: 40px;
            padding: 2.2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: background 0.25s, border 0.25s, transform 0.15s;
            margin-bottom: 1.8rem;
            box-shadow: 0 4px 12px rgba(106, 61, 232, 0.06);
        }

        .drop-zone:hover {
            background: #f3ecff;
            border-color: #a884ff;
        }

        .drop-zone:active { transform: scale(0.98); }

        .drop-zone input { display: none; }

        .drop-icon {
            font-size: 3.2rem;
            line-height: 1;
            filter: drop-shadow(0 4px 8px rgba(106, 61, 232, 0.15));
        }

        .drop-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c1a4e;
            margin: 0.3rem 0 0.2rem;
        }

        .drop-hint {
            color: #6a4f9e;
            font-size: 0.9rem;
            background: #ede4ff;
            display: inline-block;
            padding: 0.2rem 1.6rem;
            border-radius: 30px;
            font-weight: 500;
        }

        /* file list */
        .file-list {
            background: #f8f2ff;
            border-radius: 32px;
            padding: 0.8rem 1.2rem;
            margin: 1.2rem 0 1.6rem;
            box-shadow: inset 0 2px 6px rgba(106, 61, 232, 0.06);
            border: 1px solid #e0d0ff;
            min-height: 60px;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-list::-webkit-scrollbar { width: 6px; }
        .file-list::-webkit-scrollbar-track { background: #ede4ff; border-radius: 20px; }
        .file-list::-webkit-scrollbar-thumb { background: #c9b0ff; border-radius: 20px; }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.3rem;
            border-bottom: 1px solid #e7dcff;
            font-size: 0.95rem;
            color: #2c1a4e;
        }

        .file-item:last-child { border-bottom: none; }

        .file-name {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .file-name i {
            color: #6a3de8;
            font-size: 1.2rem;
            width: 1.6rem;
            text-align: center;
        }

        .file-size {
            background: #e7dcff;
            padding: 0.1rem 0.9rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #3b1f7a;
        }

        .empty-message {
            color: #9a82bf;
            text-align: center;
            padding: 0.6rem 0;
            font-size: 0.95rem;
        }

        /* actions */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 1.6rem;
            justify-content: center;
        }

        .btn {
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: 0.2s;
            flex: 1 1 auto;
            min-width: 130px;
            box-shadow: 0 6px 14px rgba(106, 61, 232, 0.1);
            border: 1px solid #d9c8ff;
        }

        .btn-primary {
            background: #6a3de8;
            color: white;
            border-color: #7b4cff;
            box-shadow: 0 8px 20px rgba(106, 61, 232, 0.3);
        }

        .btn-primary:hover {
            background: #4a27b0;
            transform: scale(0.97);
            box-shadow: 0 6px 16px rgba(74, 39, 176, 0.35);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        .btn-secondary {
            background: #f5f0ff;
            border-color: #d9c8ff;
        }

        .btn-secondary:hover { background: #ede4ff; }

        /* status */
        .status-msg {
            text-align: center;
            margin-top: 1.2rem;
            font-weight: 500;
            color: #3b1f7a;
            background: #f3ecff;
            padding: 0.6rem 1rem;
            border-radius: 60px;
            font-size: 0.95rem;
            border: 1px solid #e0d0ff;
            transition: 0.2s;
        }

        .status-msg.success {
            background: #d8ebd2;
            border-color: #9fc7a0;
            color: #1c4827;
        }

        .status-msg.error {
            background: #ffe1d6;
            border-color: #e7b6a4;
            color: #7d3f2b;
        }

        .footer-love {
            margin-top: 2.2rem;
            text-align: center;
            font-size: 0.9rem;
            color: #7a5fa8;
            letter-spacing: 0.3px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .footer-love i { color: #6a3de8; }

        /* ================================================
           ✅ DESKTOP FULL SCREEN FIT (900px and above)
           ================================================ */
        @media (min-width: 900px) {
            body {
                padding: 40px 30px;
                align-items: center;
                justify-content: center;
            }

            .page-shell {
                max-width: 1300px;
                gap: 25px;
            }

            .card {
                max-width: 950px;
                padding: 3rem 3.2rem 3.4rem;
                border-radius: 64px 64px 56px 56px;
            }

            .brand h1 { font-size: 2.4rem; }
            .brand i { font-size: 2.8rem; }

            .header-badge {
                font-size: 1rem;
                padding: 0.5rem 1.6rem;
            }

            .drop-zone {
                padding: 3rem 2rem;
            }

            .drop-icon { font-size: 4rem; }
            .drop-text { font-size: 1.4rem; }
            .drop-hint { font-size: 1rem; padding: 0.3rem 2rem; }

            .file-list {
                padding: 1rem 1.6rem;
                max-height: 260px;
            }

            .file-item {
                font-size: 1.05rem;
                padding: 0.7rem 0.4rem;
            }

            .file-name i { font-size: 1.3rem; width: 1.8rem; }
            .file-size { font-size: 0.82rem; padding: 0.15rem 1.1rem; }

            .btn {
                padding: 1rem 2.2rem;
                font-size: 1.05rem;
                min-width: 160px;
            }

            .status-msg {
                font-size: 1.02rem;
                padding: 0.8rem 1.4rem;
            }

            .footer-love { font-size: 1rem; }
        }

        /* ✅ LARGE DESKTOP (1200px+) */
        @media (min-width: 1200px) {
            .card {
                max-width: 1050px;
                padding: 3.4rem 3.8rem 3.8rem;
            }

            .brand h1 { font-size: 2.6rem; }

            .drop-zone { padding: 3.4rem 2.4rem; }

            .drop-icon { font-size: 4.4rem; }
            .drop-text { font-size: 1.5rem; }
        }

        @media (max-width: 600px) {
            body { padding-top: 4.5rem; }
            .home-btn-wrapper { top: 12px; right: 12px; }
            .home-btn { padding: 8px 16px; font-size: 13px; }
        }

        @media (max-width: 480px) {
            .card { padding: 1.5rem; }
            .brand h1 { font-size: 1.5rem; }
            .drop-zone { padding: 1.5rem 1rem; }
            .btn { min-width: 100px; padding: 0.7rem 1.2rem; font-size: 0.9rem; }
            .header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<!-- HOME BUTTON -->
<div class="home-btn-wrapper">
    <a href="index.html" class="home-btn">
        <i class="fas fa-home"></i> Home
    </a>
</div>

<div class="page-shell">
    <div class="card">
        <!-- header -->
        <div class="header">
            <div class="brand">
                <i class="fas fa-file-archive"></i>
                <h1>
                    ZipLoved
                    <small>compressor</small>
                </h1>
            </div>
            <div class="header-badge">
                <i class="fas fa-heart" style="color:#6a3de8;"></i> all types · one ZIP
            </div>
        </div>

        <!-- drop zone -->
        <div class="drop-zone" id="dropZone">
            <input type="file" id="fileInput" multiple />
            <div class="drop-icon">📂</div>
            <div class="drop-text">Drop files here or click</div>
            <div class="drop-hint">.apk · .html · .css · .js · images & more</div>
        </div>

        <!-- file list -->
        <div class="file-list" id="fileListContainer">
            <div class="empty-message">
                <i class="fas fa-heart" style="margin-right: 6px;"></i> no files yet — show some love
            </div>
        </div>

        <!-- actions -->
        <div class="actions">
            <button class="btn btn-secondary" id="clearBtn"><i class="fas fa-trash-alt"></i> Clear all</button>
            <button class="btn btn-primary" id="zipBtn"><i class="fas fa-file-archive"></i> ZIP & Download</button>
        </div>

        <!-- status -->
        <div class="status-msg" id="statusMsg">📌 ready to zip</div>

        <div class="footer-love">
            <i class="fas fa-heart"></i> Made with Love · Create by Sandesh <i class="fas fa-heart"></i>
        </div>
    </div>
</div>

<!-- JSZip + FileSaver -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script>
    (function() {
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileListContainer = document.getElementById('fileListContainer');
        const clearBtn = document.getElementById('clearBtn');
        const zipBtn = document.getElementById('zipBtn');
        const statusMsg = document.getElementById('statusMsg');

        let fileCollection = [];

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const map = {
                'apk': 'fab fa-android',
                'html': 'fab fa-html5',
                'css': 'fab fa-css3-alt',
                'js': 'fab fa-js',
                'json': 'fas fa-code',
                'png': 'fas fa-image',
                'jpg': 'fas fa-image',
                'jpeg': 'fas fa-image',
                'gif': 'fas fa-image',
                'svg': 'fas fa-image',
                'pdf': 'fas fa-file-pdf',
                'txt': 'fas fa-file-alt',
                'zip': 'fas fa-file-archive',
                'rar': 'fas fa-file-archive',
                'mp4': 'fas fa-video',
                'mp3': 'fas fa-music',
                'wav': 'fas fa-music',
            };
            return map[ext] || 'fas fa-file';
        }

        function updateStatus(text, className = '') {
            statusMsg.textContent = text;
            statusMsg.className = 'status-msg' + (className ? ' ' + className : '');
        }

        function resetStatus() {
            updateStatus('📌 ready to zip', '');
        }

        function renderFileList() {
            if (fileCollection.length === 0) {
                fileListContainer.innerHTML = `
                    <div class="empty-message">
                        <i class="fas fa-heart" style="margin-right: 6px;"></i> no files yet — show some love
                    </div>
                `;
                return;
            }

            let html = '';
            fileCollection.forEach((file) => {
                const icon = getFileIcon(file.name);
                html += `
                    <div class="file-item">
                        <span class="file-name">
                            <i class="${icon}"></i>
                            <span>${file.name}</span>
                        </span>
                        <span class="file-size">${formatFileSize(file.size)}</span>
                    </div>
                `;
            });
            fileListContainer.innerHTML = html;
        }

        function addFiles(files) {
            const existing = new Set(fileCollection.map(f => f.name));
            let added = 0;
            for (const file of files) {
                if (!existing.has(file.name)) {
                    fileCollection.push(file);
                    existing.add(file.name);
                    added++;
                }
            }
            if (added > 0) {
                renderFileList();
                updateStatus(`✅ added ${added} file${added > 1 ? 's' : ''}`, '');
                setTimeout(resetStatus, 1500);
            } else {
                updateStatus('⚠️ files already in list', 'error');
                setTimeout(resetStatus, 1500);
            }
        }

        // --- events ---
        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                addFiles(e.target.files);
            }
            fileInput.value = '';
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.background = '#f3ecff';
            dropZone.style.borderColor = '#a884ff';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.background = 'rgba(245, 238, 255, 0.6)';
            dropZone.style.borderColor = '#c9b0ff';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.background = 'rgba(245, 238, 255, 0.6)';
            dropZone.style.borderColor = '#c9b0ff';
            if (e.dataTransfer.files.length > 0) {
                addFiles(e.dataTransfer.files);
            }
        });

        clearBtn.addEventListener('click', () => {
            if (fileCollection.length === 0) {
                updateStatus('📭 no files to clear', '');
                setTimeout(resetStatus, 1200);
                return;
            }
            fileCollection = [];
            renderFileList();
            updateStatus('🗑️ all cleared', '');
            setTimeout(resetStatus, 1200);
        });

        // --- ZIP ---
        zipBtn.addEventListener('click', () => {
            if (fileCollection.length === 0) {
                updateStatus('❌ add some files first', 'error');
                setTimeout(resetStatus, 2000);
                return;
            }

            zipBtn.disabled = true;
            zipBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> zipping...';
            updateStatus('🔄 creating ZIP...', '');

            const zip = new JSZip();
            for (const file of fileCollection) {
                zip.file(file.name, file);
            }

            zip.generateAsync({ type: 'blob' })
                .then((blob) => {
                    saveAs(blob, 'loved-files.zip');
                    updateStatus(`💜 ${fileCollection.length} files zipped with love!`, 'success');
                    setTimeout(resetStatus, 2500);
                })
                .catch((err) => {
                    console.error(err);
                    updateStatus('❌ zip failed: ' + (err.message || 'unknown'), 'error');
                })
                .finally(() => {
                    zipBtn.disabled = false;
                    zipBtn.innerHTML = '<i class="fas fa-file-archive"></i> ZIP & Download';
                });
        });

        // initial render
        renderFileList();
        resetStatus();
        console.log('✨ ZipLoved · Sandesh style');
    })();
</script>
</body>
</html>
