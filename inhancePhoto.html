<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblur Image HD · Turn blurry photos into clear memories</title>
    <!-- ✅ FAVICON - Folder ke andar wali files -->
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-purple: #7c3aed;
            --light-purple-bg: #f3f0ff;
            --border-purple: #d8b4fe;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --success-green: #6ee7b7;
            --success-hover: #34d399;
            --btn-shadow: 0 4px 6px -1px rgba(124, 58, 237, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body { min-height: 100%; }

        body {
            background-color: #f3f4f6;
            background-image: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--text-dark);
        }

        /* ---------- HOME BUTTON ---------- */
        .home-btn-wrapper {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            color: var(--primary-purple);
            border: 2px solid var(--border-purple);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(124, 58, 237, 0.15);
        }

        .home-btn:hover {
            background: var(--primary-purple);
            color: white;
            border-color: var(--primary-purple);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.35);
        }

        .home-btn i { font-size: 15px; }

        /* ---------- PAGE SHELL ---------- */
        .page-shell {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        /* Top Header Styling */
        .page-header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        .page-header h1 {
            font-size: 28px;
            color: var(--text-dark);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .page-header p.subtitle {
            color: var(--text-light);
            font-size: 15px;
            background: white;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Main Card Container */
        .main-card {
            background: white;
            width: 100%;
            max-width: 900px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05), 0 0 0 1px rgba(124, 58, 237, 0.1);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        /* Upload Box */
        .upload-box {
            border: 2px dashed var(--border-purple);
            background-color: #faf5ff;
            border-radius: 16px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            margin-bottom: 25px;
        }

        .upload-box:hover {
            background-color: #f3e8ff;
            border-color: var(--primary-purple);
        }

        .upload-box input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .folder-icon {
            font-size: 48px;
            color: var(--primary-purple);
            margin-bottom: 15px;
            display: block;
        }

        .upload-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .upload-subtitle {
            font-size: 14px;
            color: var(--text-light);
            background: white;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
        }

        /* Comparison Grid */
        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 700px) {
            .comparison { grid-template-columns: 1fr; }
        }

        .image-panel {
            background: #f8fafc;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 2px solid #e2e8f0;
            transition: all 0.2s;
        }

        .image-panel .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            font-size: 0.95rem;
            text-align: center;
            padding: 24px;
        }

        .image-panel .placeholder i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--border-purple);
        }

        .image-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .panel-label {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(124, 58, 237, 0.9);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            z-index: 5;
        }

        .face-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--success-green);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 5;
        }

        /* Download Button (Inside Panel) */
        .download-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: var(--primary-purple);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            z-index: 10;
            box-shadow: var(--btn-shadow);
        }

        .download-btn:hover {
            background: #6d28d9;
            transform: translateY(-2px);
        }

        .download-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            background: #94a3b8;
            box-shadow: none;
        }

        /* Action Buttons Row */
        .actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .btn {
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary-purple);
            color: white;
            box-shadow: var(--btn-shadow);
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #6d28d9;
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background-color: white;
            color: var(--primary-purple);
            border: 1px solid var(--border-purple);
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: var(--light-purple-bg);
            border-color: var(--primary-purple);
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 100px;
            margin-bottom: 20px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary-purple), #a855f7);
            border-radius: 100px;
            transition: width 0.3s ease;
        }

        .progress-container.active { display: block; }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        /* Features Section */
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        @media (max-width: 800px) {
            .features { grid-template-columns: 1fr; }
        }

        .feature {
            background: #f8fafc;
            padding: 25px 20px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            text-align: center;
            transition: transform 0.2s;
        }

        .feature:hover {
            transform: translateY(-4px);
            border-color: var(--border-purple);
        }

        .feature i {
            font-size: 1.8rem;
            color: var(--primary-purple);
            background: var(--light-purple-bg);
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 15px;
            display: inline-block;
        }

        .feature h4 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .feature p {
            color: var(--text-light);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* Footer */
        .footer {
            margin-top: 30px;
            text-align: center;
            color: var(--primary-purple);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        /* ================================================
           ✅ DESKTOP FULL SCREEN FIT (900px and above)
           ================================================ */
        @media (min-width: 900px) {
            body {
                padding: 40px 30px;
            }

            .page-shell {
                max-width: 1300px;
                gap: 25px;
            }

            .main-card {
                max-width: 1100px;
                padding: 45px 50px;
                border-radius: 26px;
            }

            .page-header h1 { font-size: 36px; }
            .page-header p.subtitle {
                font-size: 16px;
                padding: 8px 22px;
            }

            .upload-box { padding: 65px 30px; }
            .folder-icon { font-size: 60px; }
            .upload-title { font-size: 22px; }
            .upload-subtitle { font-size: 15px; padding: 6px 16px; }

            .comparison {
                gap: 28px;
                margin-bottom: 32px;
            }

            .image-panel { border-radius: 20px; }
            .panel-label { font-size: 0.9rem; padding: 8px 18px; }
            .face-badge { font-size: 0.85rem; padding: 8px 14px; }

            .download-btn {
                padding: 10px 20px;
                font-size: 0.95rem;
            }

            .btn {
                padding: 16px 40px;
                font-size: 17px;
            }

            .progress-container { height: 8px; margin-bottom: 24px; }

            .features {
                gap: 28px;
                margin-top: 40px;
            }

            .feature {
                padding: 32px 26px;
                border-radius: 20px;
            }

            .feature i { font-size: 2.2rem; padding: 18px; }
            .feature h4 { font-size: 1.25rem; }
            .feature p { font-size: 1rem; }

            .footer { font-size: 15px; margin-top: 40px; }
        }

        /* ✅ LARGE DESKTOP (1200px+) */
        @media (min-width: 1200px) {
            .main-card {
                max-width: 1200px;
                padding: 55px 60px;
            }

            .page-header h1 { font-size: 40px; }
            .upload-box { padding: 75px 35px; }
            .folder-icon { font-size: 68px; }
            .upload-title { font-size: 24px; }
        }

        /* Mobile */
        @media (max-width: 550px) {
            body { padding-top: 75px; }
            .home-btn-wrapper { top: 12px; right: 12px; }
            .home-btn { padding: 8px 16px; font-size: 13px; }
            .main-card { padding: 22px 18px; }
            .page-header h1 { font-size: 22px; }
            .upload-box { padding: 40px 18px; }
        }
    </style>
</head>
<body>

    <!-- HOME BUTTON -->
    <div class="home-btn-wrapper">
        <a href="index.html" class="home-btn">
            <i class="fas fa-home"></i> Home
        </a>
    </div>

    <div class="page-shell">
        <!-- Header Section -->
        <div class="page-header">
            <h1>Unblur Image To HD Quality Images</h1>
            <p class="subtitle">Turn blurry photos into clear memories</p>
        </div>

        <!-- Main Card -->
        <div class="main-card">

            <!-- Upload Section -->
            <div class="upload-box" id="uploadArea">
                <div class="folder-icon">
                    <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <div class="upload-title">Drop your blurry photo here</div>
                <div class="upload-subtitle">or click to browse — JPG, PNG, WEBP</div>
                <input type="file" id="fileInput" accept="image/*">
            </div>

            <!-- Progress Bar -->
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <!-- Comparison Grid -->
            <div class="comparison">
                <!-- Original Image Panel -->
                <div class="image-panel" id="originalPanel">
                    <div class="placeholder" id="originalPlaceholder">
                        <i class="fas fa-image"></i>
                        <span>Your blurry photo</span>
                    </div>
                    <img id="originalImg" class="hidden" alt="Original blurry photo">
                    <span class="panel-label">Before</span>
                </div>

                <!-- Result Image Panel -->
                <div class="image-panel" id="resultPanel">
                    <div class="placeholder" id="resultPlaceholder">
                        <i class="fas fa-wand-magic-sparkles"></i>
                        <span>AI enhanced result</span>
                    </div>
                    <img id="resultImg" class="hidden" alt="Unblurred clear photo">
                    <span class="panel-label">After · HD</span>
                    <div class="face-badge hidden" id="faceBadge">
                        <i class="fas fa-user-check"></i> Face enhanced
                    </div>
                    <button class="download-btn hidden" id="downloadBtn" title="Download HD image">
                        <i class="fas fa-download"></i> Download HD
                    </button>
                </div>
            </div>

            <!-- Actions Row -->
            <div class="actions">
                <button class="btn btn-secondary" id="resetBtn" disabled>
                    <i class="fas fa-rotate-left"></i> Reset
                </button>
                <button class="btn btn-primary" id="unblurBtn" disabled>
                    <i class="fas fa-sparkles"></i> Unblur HD
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <i class="fa-solid fa-heart"></i> Made with Love · Create by Sandesh <i class="fa-solid fa-heart"></i>
        </div>
    </div>

    <script>
        (function() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            const originalImg = document.getElementById('originalImg');
            const originalPlaceholder = document.getElementById('originalPlaceholder');
            const resultImg = document.getElementById('resultImg');
            const resultPlaceholder = document.getElementById('resultPlaceholder');
            const unblurBtn = document.getElementById('unblurBtn');
            const resetBtn = document.getElementById('resetBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const faceBadge = document.getElementById('faceBadge');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');

            let currentFile = null;
            let originalImageUrl = null;
            let unblurredImageUrl = null;
            let unblurredBlob = null;
            let isProcessing = false;

            function resetProgress() {
                progressContainer.classList.remove('active');
                progressBar.style.width = '0%';
            }

            function showProgress(percent) {
                progressContainer.classList.add('active');
                progressBar.style.width = percent + '%';
            }

            function revokeUrls() {
                if (originalImageUrl) {
                    URL.revokeObjectURL(originalImageUrl);
                    originalImageUrl = null;
                }
                if (unblurredImageUrl) {
                    URL.revokeObjectURL(unblurredImageUrl);
                    unblurredImageUrl = null;
                }
                unblurredBlob = null;
            }

            function resetUI() {
                originalImg.classList.add('hidden');
                originalImg.src = '';
                originalPlaceholder.classList.remove('hidden');

                resultImg.classList.add('hidden');
                resultImg.src = '';
                resultPlaceholder.classList.remove('hidden');

                faceBadge.classList.add('hidden');
                downloadBtn.classList.add('hidden');
                downloadBtn.disabled = true;

                fileInput.value = '';
                unblurBtn.disabled = true;
                resetBtn.disabled = true;
                unblurBtn.innerHTML = '<i class="fas fa-sparkles"></i> Unblur HD';

                revokeUrls();
                currentFile = null;
                isProcessing = false;
                resetProgress();

                uploadArea.style.borderColor = 'var(--border-purple)';
                uploadArea.style.background = '#faf5ff';
            }

            function handleFile(file) {
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    alert('Please select an image file (JPG, PNG, WEBP).');
                    return;
                }

                revokeUrls();
                currentFile = file;
                originalImageUrl = URL.createObjectURL(file);

                originalImg.src = originalImageUrl;
                originalImg.classList.remove('hidden');
                originalPlaceholder.classList.add('hidden');

                resultImg.classList.add('hidden');
                resultImg.src = '';
                resultPlaceholder.classList.remove('hidden');
                faceBadge.classList.add('hidden');
                downloadBtn.classList.add('hidden');
                downloadBtn.disabled = true;

                unblurBtn.disabled = false;
                resetBtn.disabled = false;
                unblurBtn.innerHTML = '<i class="fas fa-sparkles"></i> Unblur HD';
                resetProgress();
            }

            function generateHDUnblur(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const scale = 1.4;
                            const width = Math.round(img.width * scale);
                            const height = Math.round(img.height * scale);

                            const canvas = document.createElement('canvas');
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d', { willReadFrequently: true });

                            ctx.imageSmoothingEnabled = true;
                            ctx.imageSmoothingQuality = 'high';
                            ctx.drawImage(img, 0, 0, width, height);

                            const imageData = ctx.getImageData(0, 0, width, height);
                            const data = imageData.data;
                            const w = width;
                            const h = height;

                            const originalData = new Uint8ClampedArray(data);
                            const kernel = [
                                0, -0.5, 0,
                                -0.5, 3, -0.5,
                                0, -0.5, 0
                            ];
                            const kSize = 3;
                            const half = 1;

                            for (let y = 0; y < h; y++) {
                                for (let x = 0; x < w; x++) {
                                    const idx = (y * w + x) * 4;
                                    let r = 0, g = 0, b = 0;

                                    for (let ky = 0; ky < kSize; ky++) {
                                        for (let kx = 0; kx < kSize; kx++) {
                                            const px = Math.min(w - 1, Math.max(0, x + kx - half));
                                            const py = Math.min(h - 1, Math.max(0, y + ky - half));
                                            const pidx = (py * w + px) * 4;
                                            const weight = kernel[ky * kSize + kx];

                                            r += originalData[pidx] * weight;
                                            g += originalData[pidx + 1] * weight;
                                            b += originalData[pidx + 2] * weight;
                                        }
                                    }

                                    data[idx] = Math.min(255, Math.max(0, r));
                                    data[idx + 1] = Math.min(255, Math.max(0, g));
                                    data[idx + 2] = Math.min(255, Math.max(0, b));
                                }
                            }

                            const contrast = 1.18;
                            const brightness = 1.02;
                            const saturation = 1.12;

                            for (let i = 0; i < data.length; i += 4) {
                                let r = data[i];
                                let g = data[i + 1];
                                let b = data[i + 2];

                                r = (r - 128) * contrast + 128;
                                g = (g - 128) * contrast + 128;
                                b = (b - 128) * contrast + 128;

                                r *= brightness;
                                g *= brightness;
                                b *= brightness;

                                const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                                r = gray + (r - gray) * saturation;
                                g = gray + (g - gray) * saturation;
                                b = gray + (b - gray) * saturation;

                                data[i] = Math.min(255, Math.max(0, r));
                                data[i + 1] = Math.min(255, Math.max(0, g));
                                data[i + 2] = Math.min(255, Math.max(0, b));
                            }

                            for (let i = 0; i < data.length; i += 4) {
                                const r = data[i];
                                const g = data[i + 1];
                                const b = data[i + 2];

                                const max = Math.max(r, g, b);
                                const min = Math.min(r, g, b);
                                const diff = max - min;

                                const isSkin = (
                                    r > 80 && g > 40 && b > 20 &&
                                    diff > 10 && diff < 120 &&
                                    r > g && r > b &&
                                    Math.abs(r - g) > 5
                                );

                                if (isSkin) {
                                    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                                    const newLum = Math.min(255, lum * 1.06);
                                    const factor = lum > 0 ? newLum / lum : 1;

                                    data[i] = Math.min(255, r * factor);
                                    data[i + 1] = Math.min(255, g * factor);
                                    data[i + 2] = Math.min(255, b * factor);
                                }
                            }

                            ctx.putImageData(imageData, 0, 0);

                            const tempCanvas = document.createElement('canvas');
                            tempCanvas.width = width;
                            tempCanvas.height = height;
                            const tctx = tempCanvas.getContext('2d');
                            tctx.drawImage(img, 0, 0, width, height);

                            ctx.globalCompositeOperation = 'overlay';
                            ctx.globalAlpha = 0.12;
                            ctx.drawImage(tempCanvas, 0, 0);

                            ctx.globalCompositeOperation = 'source-over';
                            ctx.globalAlpha = 1.0;

                            canvas.toBlob((blob) => {
                                if (blob) {
                                    unblurredBlob = blob;
                                    resolve(URL.createObjectURL(blob));
                                } else {
                                    reject(new Error('Canvas toBlob failed'));
                                }
                            }, 'image/jpeg', 0.95);
                        };
                        img.onerror = () => reject(new Error('Failed to load image'));
                        img.src = e.target.result;
                    };
                    reader.onerror = () => reject(new Error('Failed to read file'));
                    reader.readAsDataURL(file);
                });
            }

            async function handleUnblur() {
                if (!currentFile || isProcessing) return;

                isProcessing = true;
                unblurBtn.disabled = true;
                resetBtn.disabled = true;
                unblurBtn.innerHTML = '<span class="spinner"></span> Enhancing HD...';

                resultImg.classList.add('hidden');
                resultPlaceholder.classList.remove('hidden');
                faceBadge.classList.add('hidden');
                downloadBtn.classList.add('hidden');
                downloadBtn.disabled = true;

                try {
                    showProgress(10);
                    await new Promise(resolve => setTimeout(resolve, 200));

                    showProgress(30);
                    await new Promise(resolve => setTimeout(resolve, 200));

                    showProgress(50);

                    const newUrl = await generateHDUnblur(currentFile);

                    showProgress(80);
                    await new Promise(resolve => setTimeout(resolve, 200));

                    if (unblurredImageUrl) {
                        URL.revokeObjectURL(unblurredImageUrl);
                    }
                    unblurredImageUrl = newUrl;

                    resultImg.src = unblurredImageUrl;
                    resultImg.classList.remove('hidden');
                    resultPlaceholder.classList.add('hidden');

                    faceBadge.classList.remove('hidden');
                    downloadBtn.classList.remove('hidden');
                    downloadBtn.disabled = false;

                    showProgress(100);
                    await new Promise(resolve => setTimeout(resolve, 300));
                    resetProgress();

                    unblurBtn.innerHTML = '<i class="fas fa-check-circle"></i> Enhanced HD!';

                    setTimeout(() => {
                        if (unblurBtn.innerHTML.includes('Enhanced HD!')) {
                            unblurBtn.innerHTML = '<i class="fas fa-sparkles"></i> Unblur again';
                            unblurBtn.disabled = false;
                            resetBtn.disabled = false;
                        }
                    }, 2000);

                } catch (error) {
                    console.error('Unblur error:', error);
                    alert('Something went wrong while enhancing your image. Please try again.');
                    unblurBtn.innerHTML = '<i class="fas fa-sparkles"></i> Unblur HD';
                    unblurBtn.disabled = false;
                    resetBtn.disabled = false;
                    resetProgress();
                } finally {
                    isProcessing = false;
                }
            }

            function handleDownload() {
                if (!unblurredBlob) {
                    alert('No enhanced image to download yet. Please unblur first.');
                    return;
                }

                const link = document.createElement('a');
                link.href = URL.createObjectURL(unblurredBlob);
                link.download = `unblurred_hd_${Date.now()}.jpg`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
            }

            uploadArea.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) handleFile(file);
                fileInput.value = '';
            });

            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--primary-purple)';
                uploadArea.style.background = '#f3e8ff';
            });

            uploadArea.addEventListener('dragleave', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--border-purple)';
                uploadArea.style.background = '#faf5ff';
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--border-purple)';
                uploadArea.style.background = '#faf5ff';
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    handleFile(file);
                } else {
                    alert('Please drop an image file.');
                }
            });

            unblurBtn.addEventListener('click', handleUnblur);
            resetBtn.addEventListener('click', resetUI);
            downloadBtn.addEventListener('click', handleDownload);

            resetUI();
        })();
    </script>
</body>
</html>
