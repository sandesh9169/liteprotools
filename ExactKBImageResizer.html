<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exact KB Image Resizer - 3.5cm x 4.5cm</title>
    <!-- ✅ FAVICON -->
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-purple: #7c3aed;
            --light-purple-bg: #f3f0ff;
            --border-purple: #d8b4fe;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --success-green: #6ee7b7;
            --success-hover: #34d399;
            --btn-shadow: 0 4px 6px -1px rgba(124, 58, 237, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            min-height: 100%;
        }

        body {
            background-color: #f3f4f6;
            background-image: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            color: var(--text-dark);
        }

        /* ---------- HOME BUTTON ---------- */
        .home-btn-wrapper {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            color: var(--primary-purple);
            border: 2px solid var(--border-purple);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(124, 58, 237, 0.15);
        }

        .home-btn:hover {
            background: var(--primary-purple);
            color: white;
            border-color: var(--primary-purple);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.35);
        }

        .home-btn i {
            font-size: 15px;
        }

        /* ---------- MAIN LAYOUT (Centered Full-Screen Desktop) ---------- */
        .page-shell {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        /* Main Card Container */
        .main-card {
            background: white;
            width: 100%;
            max-width: 520px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08), 0 0 0 1px rgba(124, 58, 237, 0.1);
            padding: 35px 30px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Header */
        .page-header {
            text-align: center;
        }

        .page-header h1 {
            font-size: 26px;
            color: var(--text-dark);
            margin-bottom: 10px;
            font-weight: 700;
            line-height: 1.2;
        }

        .page-header p.subtitle {
            color: var(--primary-purple);
            font-size: 14px;
            background: var(--light-purple-bg);
            padding: 8px 20px;
            border-radius: 30px;
            display: inline-block;
            font-weight: 600;
            border: 1px solid var(--border-purple);
        }

        /* --- UPLOAD AREA --- */
        .upload-area {
            border: 2px dashed var(--border-purple);
            background-color: #faf5ff;
            border-radius: 20px;
            padding: 35px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .upload-area:hover, .upload-area.dragover {
            background-color: #f3e8ff;
            border-color: var(--primary-purple);
            transform: scale(1.02);
        }

        .folder-icon {
            font-size: 42px;
            color: var(--primary-purple);
            margin-bottom: 15px;
            display: block;
        }

        .upload-title {
            font-size: 17px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .upload-subtitle {
            font-size: 13px;
            color: var(--text-light);
            background: white;
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
        }

        #fileInput {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* --- SETTINGS BOX --- */
        .settings-box {
            background: #f8fafc;
            padding: 25px 20px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .tip {
            font-size: 11px;
            color: var(--primary-purple);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
            background: var(--light-purple-bg);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px dashed var(--border-purple);
        }

        /* Dimensions Grid */
        .dimension-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr auto 1fr;
            align-items: end;
            gap: 8px;
            width: 100%;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .input-group label {
            font-size: 10px;
            color: var(--text-light);
            font-weight: 700;
            text-transform: uppercase;
            text-align: center;
            white-space: nowrap;
        }

        .input-group input {
            width: 100%;
            padding: 12px 5px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
            transition: all 0.2s;
            background: white;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .operator {
            font-size: 18px;
            font-weight: bold;
            color: var(--border-purple);
            padding-bottom: 12px;
            text-align: center;
        }

        /* --- OPTIONS --- */
        .options-row {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .checkbox-label {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 14px;
            color: var(--text-dark);
            font-weight: 600;
            cursor: pointer;
            background: white;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            transition: border-color 0.2s;
            line-height: 1.4;
        }

        .checkbox-label:hover {
            border-color: var(--border-purple);
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-purple);
            cursor: pointer;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .size-input-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: white;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            width: 100%;
        }

        .size-input-wrapper span {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
        }

        .size-input-wrapper input {
            width: 90px;
            padding: 10px;
            border: 1px solid var(--border-purple);
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            color: var(--primary-purple);
            outline: none;
            background: var(--light-purple-bg);
        }

        .format-options {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-size: 14px;
            font-weight: 600;
            background: white;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .format-options span {
            color: var(--text-light);
            font-size: 13px;
        }

        .format-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-dark);
        }

        .format-options input[type="radio"] {
            accent-color: var(--primary-purple);
            transform: scale(1.2);
            cursor: pointer;
        }

        /* --- ACTION BUTTON --- */
        .resize-btn {
            background-color: var(--primary-purple);
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            letter-spacing: 0.5px;
            box-shadow: var(--btn-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .resize-btn:hover:not(:disabled) {
            background-color: #6d28d9;
            transform: translateY(-2px);
        }

        .resize-btn:disabled {
            background-color: #a78bfa;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .note {
            font-size: 12px;
            color: var(--text-light);
            text-align: center;
            font-weight: 500;
        }

        /* --- LOADER --- */
        .loader-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 20px;
            background: var(--light-purple-bg);
            border-radius: 16px;
            border: 1px dashed var(--border-purple);
        }

        .loader {
            border: 4px solid #e2e8f0;
            border-top: 4px solid var(--primary-purple);
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
        }

        .loader-text {
            font-size: 14px;
            color: var(--primary-purple);
            font-weight: 700;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- RESULTS --- */
        .results {
            text-align: left;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .results::-webkit-scrollbar { width: 6px; }
        .results::-webkit-scrollbar-thumb { background: var(--border-purple); border-radius: 3px; }

        .result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            padding: 15px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: transform 0.2s;
            gap: 15px;
        }

        .result-item:hover {
            transform: translateX(5px);
            border-color: var(--border-purple);
        }

        .result-item img {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .file-info {
            flex: 1;
            font-size: 12px;
            color: var(--text-light);
            line-height: 1.5;
        }

        .file-info strong {
            color: var(--text-dark);
            font-size: 13px;
            display: block;
            margin-bottom: 4px;
        }

        .size-badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 11px;
            display: inline-block;
        }

        .download-link {
            background: var(--primary-purple);
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--btn-shadow);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .download-link:hover {
            background: #6d28d9;
            transform: translateY(-2px);
        }

        /* Footer */
        .footer {
            margin-top: 10px;
            text-align: center;
            color: var(--primary-purple);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        /* ================================================
           ✅ DESKTOP FULL SCREEN FIT (900px and above)
           ================================================ */
        @media (min-width: 900px) {
            body {
                padding: 40px 30px;
                align-items: center;
                justify-content: center;
            }

            .page-shell {
                max-width: 1300px;
                gap: 25px;
            }

            .main-card {
                max-width: 640px;
                padding: 45px 45px;
                gap: 28px;
            }

            .page-header h1 {
                font-size: 32px;
            }

            .page-header p.subtitle {
                font-size: 15px;
                padding: 10px 24px;
            }

            .upload-area {
                padding: 45px 25px;
            }

            .folder-icon {
                font-size: 52px;
                margin-bottom: 18px;
            }

            .upload-title {
                font-size: 19px;
            }

            .upload-subtitle {
                font-size: 14px;
                padding: 8px 18px;
            }

            .settings-box {
                padding: 30px 25px;
                gap: 22px;
            }

            .input-group label {
                font-size: 11px;
            }

            .input-group input {
                font-size: 16px;
                padding: 14px 8px;
            }

            .checkbox-label {
                font-size: 15px;
                padding: 18px;
            }

            .size-input-wrapper {
                padding: 15px 18px;
            }

            .size-input-wrapper input {
                width: 110px;
                font-size: 15px;
            }

            .format-options {
                font-size: 15px;
                padding: 18px;
                gap: 25px;
            }

            .resize-btn {
                padding: 20px 35px;
                font-size: 17px;
            }

            .result-item img {
                width: 70px;
                height: 70px;
            }

            .file-info {
                font-size: 13px;
            }

            .file-info strong {
                font-size: 14px;
            }

            .download-link {
                padding: 12px 20px;
                font-size: 13px;
            }
        }

        /* ✅ LARGE DESKTOP (1200px+) */
        @media (min-width: 1200px) {
            .main-card {
                max-width: 700px;
                padding: 50px 55px;
            }

            .page-header h1 {
                font-size: 34px;
            }
        }

        /* Responsive */
        @media (max-width: 550px) {
            body { padding-top: 75px; }
            .home-btn-wrapper { top: 12px; right: 12px; }
            .home-btn { padding: 8px 16px; font-size: 13px; }
        }

        @media (max-width: 450px) {
            .main-card { padding: 25px 15px; }
            .page-header h1 { font-size: 22px; }
            .dimension-grid {
                grid-template-columns: 1fr 1fr;
                gap: 15px;
            }
            .operator { display: none; }
            .input-group:nth-child(1) { grid-column: 1 / -1; }
            .result-item { flex-direction: column; text-align: center; }
            .file-info { text-align: center; }
            .download-link { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- HOME BUTTON -->
    <div class="home-btn-wrapper">
        <a href="index.html" class="home-btn">
            <i class="fas fa-home"></i> Home
        </a>
    </div>

    <div class="page-shell">
        <div class="main-card">
            <!-- Header -->
            <div class="page-header">
                <h1>Exact KB Image Resizer</h1>
                <p class="subtitle">Passport Size (3.5cm x 4.5cm)</p>
            </div>

            <!-- Upload Area -->
            <div class="upload-area" id="uploadArea">
                <div class="folder-icon">
                    <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <div class="upload-title">Drop images here or click</div>
                <div class="upload-subtitle">JPG, PNG · Max 10 images</div>
                <input type="file" id="fileInput" accept="image/*" multiple>
            </div>

            <!-- Settings Area -->
            <div class="settings-box">
                <p class="tip"><i class="fas fa-magic"></i> Tip: Crop image for perfect aspect ratio</p>

                <!-- Dimensions Grid -->
                <div class="dimension-grid">
                    <div class="input-group">
                        <label>DPI</label>
                        <input type="number" id="dpiInput" value="200" min="1">
                    </div>
                    <div class="operator">=</div>
                    <div class="input-group">
                        <label>Width (CM)</label>
                        <input type="number" id="widthInput" value="3.5" step="0.1" min="0.1">
                    </div>
                    <div class="operator">X</div>
                    <div class="input-group">
                        <label>Height (CM)</label>
                        <input type="number" id="heightInput" value="4.5" step="0.1" min="0.1">
                    </div>
                </div>

                <!-- Compress & Format Options -->
                <div class="options-row">
                    <label class="checkbox-label">
                        <input type="checkbox" id="compressCheck" checked>
                        <span>Compress to specific size (Ex. 100kb)</span>
                    </label>

                    <div class="size-input-wrapper" id="sizeWrapper">
                        <span>Size:</span>
                        <input type="number" id="targetSize" value="100" min="1">
                        <span>KB</span>
                    </div>

                    <!-- Format -->
                    <div class="format-options">
                        <span>Output:</span>
                        <label>
                            <input type="radio" name="format" value="jpeg" checked> JPEG
                        </label>
                        <label>
                            <input type="radio" name="format" value="jpg"> JPG
                        </label>
                    </div>
                </div>
            </div>

            <!-- Action Button -->
            <button class="resize-btn" id="resizeBtn">
                <i class="fas fa-magic"></i> Resize Image
            </button>

            <!-- Loader -->
            <div class="loader-container" id="loaderContainer">
                <div class="loader"></div>
                <div class="loader-text">Processing... Please wait</div>
            </div>

            <p class="note">Note: You can resize up to 10 images at once.</p>

            <!-- Results -->
            <div class="results" id="results"></div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <i class="fa-solid fa-heart"></i> Made with Love · Create by Sandesh <i class="fa-solid fa-heart"></i>
        </div>
    </div>

    <script>
        /* --- JAVASCRIPT LOGIC --- */

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const resizeBtn = document.getElementById('resizeBtn');
        const resultsDiv = document.getElementById('results');
        const loaderContainer = document.getElementById('loaderContainer');
        const compressCheck = document.getElementById('compressCheck');
        const sizeWrapper = document.getElementById('sizeWrapper');

        let filesToProcess = [];

        compressCheck.addEventListener('change', () => {
            sizeWrapper.style.display = compressCheck.checked ? 'flex' : 'none';
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            if (files.length > 10) {
                alert("Aap ek baar mein maximum 10 images hi resize kar sakte hain.");
                return;
            }
            filesToProcess = Array.from(files);
            if(filesToProcess.length > 0) {
                uploadArea.querySelector('.upload-title').innerText = `${filesToProcess.length} Image(s) Selected`;
                uploadArea.querySelector('.upload-title').style.color = 'var(--primary-purple)';
            }
        }

        resizeBtn.addEventListener('click', async () => {
            if (filesToProcess.length === 0) {
                alert("Kripya pehle koi image select karein!");
                return;
            }

            const dpi = parseFloat(document.getElementById('dpiInput').value) || 200;
            const widthCm = parseFloat(document.getElementById('widthInput').value) || 3.5;
            const heightCm = parseFloat(document.getElementById('heightInput').value) || 4.5;
            const shouldCompress = compressCheck.checked;
            const targetSizeKb = parseFloat(document.getElementById('targetSize').value) || 100;
            const format = document.querySelector('input[name="format"]:checked').value;
            const mimeType = format === 'jpg' ? 'image/jpeg' : `image/${format}`;

            const targetWidthPx = Math.round((widthCm / 2.54) * dpi);
            const targetHeightPx = Math.round((heightCm / 2.54) * dpi);

            resultsDiv.innerHTML = '';
            loaderContainer.style.display = 'flex';
            resizeBtn.disabled = true;
            resizeBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            for (const file of filesToProcess) {
                try {
                    const targetBytes = targetSizeKb * 1024;
                    const result = await processImage(file, targetWidthPx, targetHeightPx, mimeType, shouldCompress, targetBytes);
                    displayResult(result);
                } catch (error) {
                    console.error("Error processing " + file.name, error);
                    displayError(file.name);
                }
            }

            loaderContainer.style.display = 'none';
            resizeBtn.disabled = false;
            resizeBtn.innerHTML = '<i class="fas fa-magic"></i> Resize Image';
            uploadArea.querySelector('.upload-title').innerText = 'Drop images here or click';
            uploadArea.querySelector('.upload-title').style.color = '#1f2937';
            filesToProcess = [];
            fileInput.value = '';
        });

        function processImage(file, targetW, targetH, mimeType, compress, targetBytes) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = targetW;
                        canvas.height = targetH;
                        const ctx = canvas.getContext('2d');

                        ctx.drawImage(img, 0, 0, targetW, targetH);

                        if (compress) {
                            compressToExactSize(canvas, mimeType, targetBytes, resolve, file.name, targetW, targetH);
                        } else {
                            canvas.toBlob((blob) => {
                                resolve({
                                    name: file.name,
                                    blob: blob,
                                    width: targetW,
                                    height: targetH,
                                    size: (blob.size / 1024).toFixed(1),
                                    target: 'N/A'
                                });
                            }, mimeType, 0.95);
                        }
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }

        function compressToExactSize(canvas, mimeType, targetBytes, resolve, originalName, w, h) {
            let minQuality = 0.01;
            let maxQuality = 1.0;
            let quality = 0.9;
            let iterations = 0;
            const maxIterations = 15;

            function attempt() {
                canvas.toBlob((blob) => {
                    if (!blob) return resolve(null);

                    const currentSize = blob.size;
                    const isCloseEnough = Math.abs(currentSize - targetBytes) < (targetBytes * 0.02);

                    if (isCloseEnough || iterations >= maxIterations) {
                        resolve({
                            name: originalName,
                            blob: blob,
                            width: w,
                            height: h,
                            size: (blob.size / 1024).toFixed(1),
                            target: (targetBytes / 1024).toFixed(0)
                        });
                    } else {
                        if (currentSize > targetBytes) {
                            maxQuality = quality;
                            quality = (minQuality + maxQuality) / 2;
                        } else {
                            minQuality = quality;
                            quality = (minQuality + maxQuality) / 2;
                        }
                        iterations++;
                        attempt();
                    }
                }, mimeType, quality);
            }
            attempt();
        }

        function displayResult(data) {
            const url = URL.createObjectURL(data.blob);
            const div = document.createElement('div');
            div.className = 'result-item';

            const actualSize = parseFloat(data.size);
            const targetSize = parseFloat(data.target);
            const isExact = data.target !== 'N/A' && Math.abs(actualSize - targetSize) < 5;

            div.innerHTML = `
                <img src="${url}" alt="preview">
                <div class="file-info">
                    <strong>${data.name.substring(0, 18)}${data.name.length > 18 ? '...' : ''}</strong>
                    ${data.width}x${data.height}px <br>
                    <span class="size-badge" style="${isExact ? 'background:#dcfce7; color:#166534;' : 'background:#fee2e2; color:#991b1b;'}">
                        Actual: ${data.size} KB
                    </span>
                    ${data.target !== 'N/A' ? `<span style="font-size:10px; color:#888;"> (Target: ${data.target} KB)</span>` : ''}
                </div>
                <a href="${url}" download="resized_${data.name}" class="download-link">
                    <i class="fas fa-download"></i> Download
                </a>
            `;
            resultsDiv.appendChild(div);
        }

        function displayError(name) {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.style.borderLeft = "4px solid #dc2626";
            div.innerHTML = `<span style="color:#dc2626; font-size:12px; font-weight:bold;">Failed to process: ${name}</span>`;
            resultsDiv.appendChild(div);
        }
    </script>
</body>
</html>
