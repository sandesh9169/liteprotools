<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>✨ Unzip Files ·</title>
    <!-- ✅ FAVICON - Folder ke andar wali files -->
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- JSZip for unzipping -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
        }

        html, body { min-height: 100%; }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f8f0ff 0%, #f0e6ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* ---------- HOME BUTTON ---------- */
        .home-btn-wrapper {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1500;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            color: #6a3de8;
            border: 2px solid #d9c8ff;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 16px rgba(106, 61, 232, 0.15);
        }

        .home-btn:hover {
            background: linear-gradient(135deg, #6a3de8, #a884ff);
            color: white;
            border-color: #6a3de8;
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(106, 61, 232, 0.4);
        }

        .home-btn i { font-size: 15px; }

        /* ---------- PAGE SHELL ---------- */
        .page-shell {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .card {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 56px 56px 48px 48px;
            padding: 2.4rem 2.5rem 2.8rem;
            box-shadow: 0 30px 60px -15px rgba(90, 40, 140, 0.25),
                        0 0 0 1px rgba(200, 170, 255, 0.25) inset;
            border: 1px solid rgba(220, 200, 255, 0.4);
            transition: all 0.2s ease;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.8rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .brand i {
            font-size: 2.4rem;
            color: #6a3de8;
            filter: drop-shadow(0 4px 8px rgba(106, 61, 232, 0.2));
        }

        .brand h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #2c1a4e;
            letter-spacing: -0.3px;
        }

        .brand h1 small {
            font-size: 0.8rem;
            font-weight: 400;
            background: #ede4ff;
            padding: 0.2rem 1rem;
            border-radius: 60px;
            color: #5b3b9e;
            margin-left: 0.3rem;
        }

        .header-badge {
            background: white;
            border: 1px solid #d9c8ff;
            padding: 0.4rem 1.4rem;
            border-radius: 80px;
            font-weight: 600;
            color: #3b1f7a;
            box-shadow: 0 6px 16px rgba(106, 61, 232, 0.08);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.9rem;
        }

        .header-badge i { color: #6a3de8; }

        /* drop zone */
        .drop-zone {
            background: rgba(245, 238, 255, 0.6);
            border: 2px dashed #c9b0ff;
            border-radius: 40px;
            padding: 2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: background 0.25s, border 0.25s, transform 0.15s;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 12px rgba(106, 61, 232, 0.06);
        }

        .drop-zone:hover {
            background: #f3ecff;
            border-color: #a884ff;
        }

        .drop-zone:active { transform: scale(0.98); }

        .drop-zone input { display: none; }

        .drop-icon {
            font-size: 3rem;
            line-height: 1;
            filter: drop-shadow(0 4px 8px rgba(106, 61, 232, 0.15));
        }

        .drop-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c1a4e;
            margin: 0.3rem 0 0.2rem;
        }

        .drop-hint {
            color: #6a4f9e;
            font-size: 0.9rem;
            background: #ede4ff;
            display: inline-block;
            padding: 0.2rem 1.6rem;
            border-radius: 30px;
            font-weight: 500;
        }

        /* file info */
        .file-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f2ff;
            border-radius: 32px;
            padding: 0.8rem 1.5rem;
            border: 1px solid #e0d0ff;
            margin: 1.2rem 0 1.5rem;
            min-height: 60px;
            transition: 0.2s;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .file-info .file-details {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .file-info .file-details i {
            font-size: 1.8rem;
            color: #6a3de8;
        }

        .file-info .file-details .name {
            font-weight: 600;
            color: #2c1a4e;
            font-size: 0.95rem;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-info .file-details .size {
            background: #ede4ff;
            padding: 0.1rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #3b1f7a;
        }

        .file-info .file-status {
            font-size: 0.85rem;
            color: #6a4f9e;
            font-weight: 500;
        }

        .empty-file-info {
            color: #9a82bf;
            text-align: center;
            padding: 0.3rem 0;
            font-size: 0.95rem;
            width: 100%;
        }

        /* file list */
        .file-list-container {
            background: #f8f2ff;
            border-radius: 32px;
            padding: 0.8rem 1.2rem;
            margin: 1.2rem 0 1.6rem;
            border: 1px solid #e0d0ff;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }

        .file-list-container.show { display: block; }

        .file-list-container::-webkit-scrollbar { width: 6px; }
        .file-list-container::-webkit-scrollbar-track { background: #ede4ff; border-radius: 20px; }
        .file-list-container::-webkit-scrollbar-thumb { background: #c9b0ff; border-radius: 20px; }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.3rem;
            border-bottom: 1px solid #e7dcff;
            font-size: 0.9rem;
            color: #2c1a4e;
        }

        .file-item:last-child { border-bottom: none; }

        .file-item .file-name {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex: 1;
            overflow: hidden;
        }

        .file-item .file-name i {
            color: #6a3de8;
            font-size: 1rem;
            width: 1.4rem;
            text-align: center;
            flex-shrink: 0;
        }

        .file-item .file-name span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item .file-size {
            background: #ede4ff;
            padding: 0.1rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #3b1f7a;
            flex-shrink: 0;
            margin: 0 0.5rem;
        }

        .file-item .download-single-btn {
            background: #10b981;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 0.2rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            flex-shrink: 0;
        }

        .file-item .download-single-btn:hover {
            background: #059669;
            transform: scale(1.05);
        }

        .file-item .download-single-btn i { font-size: 0.6rem; color: white; }

        .file-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 0 0.6rem;
            border-bottom: 2px solid #d9c8ff;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #3b1f7a;
            font-size: 0.9rem;
        }

        /* actions */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 0.8rem;
            justify-content: center;
        }

        .btn {
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: 0.2s;
            flex: 1 1 auto;
            min-width: 120px;
            box-shadow: 0 6px 14px rgba(106, 61, 232, 0.1);
            border: 1px solid #d9c8ff;
        }

        .btn-primary {
            background: #6a3de8;
            color: white;
            border-color: #7b4cff;
            box-shadow: 0 8px 20px rgba(106, 61, 232, 0.3);
        }

        .btn-primary:hover {
            background: #4a27b0;
            transform: scale(0.97);
            box-shadow: 0 6px 16px rgba(74, 39, 176, 0.35);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        .btn-success {
            background: #10b981;
            color: white;
            border-color: #34d399;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover {
            background: #059669;
            transform: scale(0.97);
        }

        .btn-success:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        .btn-secondary {
            background: #f5f0ff;
            border-color: #d9c8ff;
            color: #3b1f7a;
        }

        .btn-secondary:hover { background: #ede4ff; }

        /* status */
        .status-msg {
            text-align: center;
            margin-top: 1.2rem;
            font-weight: 500;
            color: #3b1f7a;
            background: #f3ecff;
            padding: 0.6rem 1rem;
            border-radius: 60px;
            font-size: 0.95rem;
            border: 1px solid #e0d0ff;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .status-msg.success {
            background: #d8ebd2;
            border-color: #9fc7a0;
            color: #1c4827;
        }

        .status-msg.error {
            background: #ffe1d6;
            border-color: #e7b6a4;
            color: #7d3f2b;
        }

        .status-msg.info {
            background: #dbeafe;
            border-color: #93c5fd;
            color: #1e40af;
        }

        .footer-love {
            margin-top: 2.2rem;
            text-align: center;
            font-size: 0.9rem;
            color: #7a5fa8;
            letter-spacing: 0.3px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .footer-love i { color: #6a3de8; }

        /* progress bar */
        .progress-container {
            display: none;
            margin: 0.8rem 0;
            padding: 0.6rem 1.2rem;
            background: #f8f2ff;
            border-radius: 60px;
            border: 1px solid #e0d0ff;
        }

        .progress-container.show { display: block; }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ede4ff;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 0.3rem;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6a3de8, #a884ff);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            color: #3b1f7a;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* ================================================
           ✅ DESKTOP FULL SCREEN FIT (900px and above)
           ================================================ */
        @media (min-width: 900px) {
            body {
                padding: 40px 30px;
                align-items: center;
                justify-content: center;
            }

            .page-shell {
                max-width: 1300px;
                gap: 25px;
            }

            .card {
                max-width: 950px;
                padding: 3rem 3.2rem 3.4rem;
                border-radius: 64px 64px 56px 56px;
            }

            .brand h1 { font-size: 2.4rem; }
            .brand i { font-size: 2.8rem; }

            .header-badge {
                font-size: 1rem;
                padding: 0.5rem 1.6rem;
            }

            .drop-zone { padding: 2.8rem 2rem; }
            .drop-icon { font-size: 3.8rem; }
            .drop-text { font-size: 1.4rem; }
            .drop-hint { font-size: 1rem; padding: 0.3rem 2rem; }

            .file-info { padding: 1rem 1.8rem; }
            .file-info .file-details i { font-size: 2rem; }
            .file-info .file-details .name { font-size: 1.05rem; max-width: 280px; }
            .file-info .file-details .size { font-size: 0.85rem; padding: 0.15rem 1.1rem; }
            .file-info .file-status { font-size: 0.95rem; }

            .file-list-container {
                padding: 1rem 1.6rem;
                max-height: 380px;
            }

            .file-item { font-size: 1rem; padding: 0.7rem 0.4rem; }
            .file-item .file-name i { font-size: 1.15rem; width: 1.6rem; }
            .file-item .file-size { font-size: 0.78rem; padding: 0.15rem 1rem; }
            .file-item .download-single-btn { font-size: 0.78rem; padding: 0.3rem 1rem; }
            .file-item .download-single-btn i { font-size: 0.7rem; }

            .file-list-header { font-size: 1rem; }

            .btn {
                padding: 1rem 2.2rem;
                font-size: 1.05rem;
                min-width: 160px;
            }

            .status-msg {
                font-size: 1.02rem;
                padding: 0.8rem 1.4rem;
            }

            .footer-love { font-size: 1rem; }

            .progress-container { padding: 0.8rem 1.5rem; }
            .progress-text { font-size: 0.9rem; }
        }

        /* ✅ LARGE DESKTOP (1200px+) */
        @media (min-width: 1200px) {
            .card {
                max-width: 1050px;
                padding: 3.4rem 3.8rem 3.8rem;
            }

            .brand h1 { font-size: 2.6rem; }
            .drop-zone { padding: 3.2rem 2.4rem; }
            .drop-icon { font-size: 4.2rem; }
            .drop-text { font-size: 1.5rem; }
        }

        @media (max-width: 600px) {
            body { padding-top: 4.5rem; }
            .home-btn-wrapper { top: 12px; right: 12px; }
            .home-btn { padding: 8px 16px; font-size: 13px; }
            .card { padding: 1.5rem; }
            .brand h1 { font-size: 1.5rem; }
            .drop-zone { padding: 1.5rem 1rem; }
            .btn { min-width: 100px; padding: 0.7rem 1.2rem; font-size: 0.9rem; }
            .header { flex-direction: column; align-items: flex-start; }
            .file-info { flex-direction: column; text-align: center; }
            .file-info .file-details { flex-wrap: wrap; justify-content: center; }
            .file-item { flex-wrap: wrap; gap: 0.3rem; }
            .file-item .file-name { width: 100%; }
            .file-item .download-single-btn { margin-left: auto; }
        }

        @media (max-width: 400px) {
            .file-list-container { padding: 0.5rem 0.8rem; }
            .file-item { font-size: 0.8rem; }
            .file-item .download-single-btn { font-size: 0.6rem; padding: 0.1rem 0.6rem; }
        }
    </style>
</head>
<body>

<!-- HOME BUTTON -->
<div class="home-btn-wrapper">
    <a href="index.html" class="home-btn">
        <i class="fas fa-home"></i> Home
    </a>
</div>

<div class="page-shell">
    <div class="card">
        <!-- header -->
        <div class="header">
            <div class="brand">
                <i class="fas fa-file-archive"></i>
                <h1>
                    Unzip Files
                    <small>extractor</small>
                </h1>
            </div>
            <div class="header-badge">
                <i class="fas fa-unlock-alt"></i> ZIP · RAR · 7Z
            </div>
        </div>

        <!-- drop zone -->
        <div class="drop-zone" id="dropZone">
            <input type="file" id="fileInput" accept=".zip,.rar,.7z,.tar,.gz" multiple />
            <div class="drop-icon">📂</div>
            <div class="drop-text">Drop ZIP file here or click</div>
            <div class="drop-hint">.zip · .rar · .7z · .tar · .gz</div>
        </div>

        <!-- file info -->
        <div class="file-info" id="fileInfo">
            <div class="empty-file-info">
                <i class="fas fa-heart" style="margin-right: 6px;"></i> no ZIP file selected yet
            </div>
        </div>

        <!-- progress -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-text">
                <span><i class="fas fa-spinner fa-pulse"></i> Extracting files...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- file list (extracted files) -->
        <div class="file-list-container" id="fileListContainer">
            <div class="file-list-header">
                <span><i class="fas fa-list"></i> Extracted Files</span>
                <span id="fileCount">0 files</span>
            </div>
            <div id="fileList"></div>
        </div>

        <!-- actions -->
        <div class="actions">
            <button class="btn btn-secondary" id="resetBtn"><i class="fas fa-undo-alt"></i> Reset</button>
            <button class="btn btn-primary" id="extractBtn" disabled><i class="fas fa-unlock-alt"></i> Extract All</button>
            <button class="btn btn-success" id="downloadAllBtn" disabled><i class="fas fa-download"></i> Download All</button>
        </div>

        <!-- status -->
        <div class="status-msg" id="statusMsg">
            <i class="fas fa-circle-info"></i>
            <span>Ready · upload a ZIP file to extract</span>
        </div>

        <div class="footer-love">
            <i class="fas fa-heart"></i> Made with Love · Create by Sandesh <i class="fas fa-heart"></i>
        </div>
    </div>
</div>

<script>
    (function() {
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileInfo = document.getElementById('fileInfo');
        const extractBtn = document.getElementById('extractBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusMsg = document.getElementById('statusMsg');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const fileListContainer = document.getElementById('fileListContainer');
        const fileList = document.getElementById('fileList');
        const fileCount = document.getElementById('fileCount');

        let currentFile = null;
        let extractedFiles = [];

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const map = {
                'pdf': 'fas fa-file-pdf',
                'jpg': 'fas fa-image',
                'jpeg': 'fas fa-image',
                'png': 'fas fa-image',
                'gif': 'fas fa-image',
                'svg': 'fas fa-image',
                'webp': 'fas fa-image',
                'mp4': 'fas fa-video',
                'mp3': 'fas fa-music',
                'wav': 'fas fa-music',
                'zip': 'fas fa-file-archive',
                'rar': 'fas fa-file-archive',
                '7z': 'fas fa-file-archive',
                'tar': 'fas fa-file-archive',
                'gz': 'fas fa-file-archive',
                'html': 'fab fa-html5',
                'css': 'fab fa-css3-alt',
                'js': 'fab fa-js',
                'json': 'fas fa-code',
                'txt': 'fas fa-file-alt',
                'doc': 'fas fa-file-word',
                'docx': 'fas fa-file-word',
                'xls': 'fas fa-file-excel',
                'xlsx': 'fas fa-file-excel',
                'ppt': 'fas fa-file-powerpoint',
                'pptx': 'fas fa-file-powerpoint',
            };
            return map[ext] || 'fas fa-file';
        }

        function updateStatus(text, className = '') {
            statusMsg.innerHTML = text;
            statusMsg.className = 'status-msg' + (className ? ' ' + className : '');
        }

        function resetStatus() {
            if (currentFile) {
                updateStatus(`<i class="fas fa-file-archive" style="color:#6a3de8;"></i> ${currentFile.name} · ready to extract`, '');
            } else {
                updateStatus('<i class="fas fa-circle-info"></i> Ready · upload a ZIP file to extract', '');
            }
        }

        function renderFileInfo(file) {
            if (!file) {
                fileInfo.innerHTML = `
                    <div class="empty-file-info">
                        <i class="fas fa-heart" style="margin-right: 6px;"></i> no ZIP file selected yet
                    </div>
                `;
                return;
            }

            fileInfo.innerHTML = `
                <div class="file-details">
                    <i class="fas fa-file-archive"></i>
                    <span class="name">${file.name.length > 30 ? file.name.slice(0, 26) + '…' : file.name}</span>
                    <span class="size">${formatFileSize(file.size)}</span>
                </div>
                <div class="file-status">
                    <i class="fas fa-check-circle" style="color:#10b981;"></i> ready to extract
                </div>
            `;
        }

        function downloadSingleFile(fileData) {
            const blob = fileData.blob;
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileData.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 3000);
        }

        function renderFileList(files) {
            if (!files || files.length === 0) {
                fileListContainer.classList.remove('show');
                return;
            }

            fileListContainer.classList.add('show');
            fileCount.textContent = files.length + ' files';

            let html = '';
            files.forEach((file, index) => {
                const icon = getFileIcon(file.name);
                html += `
                    <div class="file-item">
                        <span class="file-name">
                            <i class="${icon}"></i>
                            <span>${file.name}</span>
                        </span>
                        <span class="file-size">${formatFileSize(file.size)}</span>
                        <button class="download-single-btn" data-index="${index}">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                `;
            });
            fileList.innerHTML = html;

            document.querySelectorAll('.download-single-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.dataset.index);
                    if (extractedFiles[index]) {
                        downloadSingleFile(extractedFiles[index]);
                        updateStatus(`<i class="fas fa-download" style="color:#10b981;"></i> Downloading: ${extractedFiles[index].name}`, 'success');
                        setTimeout(resetStatus, 2000);
                    }
                });
            });
        }

        function resetAll() {
            currentFile = null;
            fileInput.value = '';
            extractedFiles = [];
            renderFileInfo(null);
            fileListContainer.classList.remove('show');
            fileList.innerHTML = '';
            fileCount.textContent = '0 files';
            extractBtn.disabled = true;
            downloadAllBtn.disabled = true;
            downloadAllBtn.innerHTML = '<i class="fas fa-download"></i> Download All';
            progressContainer.classList.remove('show');
            progressFill.style.width = '0%';
            progressPercent.textContent = '0%';
            resetStatus();
        }

        function loadFile(file) {
            if (!file) return;

            const validTypes = ['.zip', '.rar', '.7z', '.tar', '.gz'];
            const ext = '.' + file.name.split('.').pop().toLowerCase();
            const isArchive = validTypes.includes(ext) || file.type === 'application/zip' || file.type === 'application/x-rar-compressed';

            if (!isArchive) {
                updateStatus('<i class="fas fa-exclamation-triangle" style="color:#fda085;"></i> Please select a ZIP/RAR/7Z archive file', 'error');
                setTimeout(resetStatus, 2000);
                return;
            }

            currentFile = file;
            renderFileInfo(file);
            extractedFiles = [];
            fileListContainer.classList.remove('show');
            fileList.innerHTML = '';
            fileCount.textContent = '0 files';
            downloadAllBtn.disabled = true;
            downloadAllBtn.innerHTML = '<i class="fas fa-download"></i> Download All';
            extractBtn.disabled = false;
            progressContainer.classList.remove('show');
            progressFill.style.width = '0%';
            progressPercent.textContent = '0%';
            resetStatus();
        }

        dropZone.addEventListener('click', function(e) {
            e.stopPropagation();
            fileInput.click();
        });

        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files.length > 0) {
                loadFile(this.files[0]);
            }
            this.value = '';
        });

        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.style.background = '#f3ecff';
            this.style.borderColor = '#a884ff';
        });

        dropZone.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.style.background = 'rgba(245, 238, 255, 0.6)';
            this.style.borderColor = '#c9b0ff';
        });

        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            this.style.background = 'rgba(245, 238, 255, 0.6)';
            this.style.borderColor = '#c9b0ff';
            if (e.dataTransfer.files.length > 0) {
                loadFile(e.dataTransfer.files[0]);
            }
        });

        resetBtn.addEventListener('click', resetAll);

        extractBtn.addEventListener('click', function() {
            if (!currentFile) {
                updateStatus('<i class="fas fa-exclamation-circle" style="color:#fda085;"></i> No file selected', 'error');
                setTimeout(resetStatus, 2000);
                return;
            }

            extractBtn.disabled = true;
            extractBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Extracting...';
            progressContainer.classList.add('show');
            progressFill.style.width = '0%';
            progressPercent.textContent = '0%';
            updateStatus('<i class="fas fa-spinner fa-pulse" style="color:#6a3de8;"></i> Extracting files...', 'info');

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const zip = new JSZip();
                    zip.loadAsync(e.target.result)
                        .then(function(zipData) {
                            const files = zipData.files;
                            const fileNames = Object.keys(files);
                            let loaded = 0;
                            const total = fileNames.length;
                            extractedFiles = [];

                            if (total === 0) {
                                updateStatus('<i class="fas fa-exclamation-circle" style="color:#fda085;"></i> ZIP file is empty', 'error');
                                extractBtn.disabled = false;
                                extractBtn.innerHTML = '<i class="fas fa-unlock-alt"></i> Extract All';
                                progressContainer.classList.remove('show');
                                setTimeout(resetStatus, 2000);
                                return;
                            }

                            fileNames.forEach(function(name, index) {
                                const file = files[name];
                                if (!file.dir) {
                                    file.async('blob').then(function(blob) {
                                        extractedFiles.push({
                                            name: name,
                                            size: blob.size,
                                            blob: blob
                                        });
                                        loaded++;
                                        const percent = Math.round((loaded / total) * 100);
                                        progressFill.style.width = percent + '%';
                                        progressPercent.textContent = percent + '%';

                                        if (loaded === total) {
                                            renderFileList(extractedFiles);
                                            downloadAllBtn.disabled = false;
                                            downloadAllBtn.innerHTML = '<i class="fas fa-download"></i> Download All (' + total + ' files)';
                                            updateStatus(`<i class="fas fa-check-circle" style="color:#10b981;"></i> Extracted ${total} files successfully!`, 'success');
                                            extractBtn.disabled = false;
                                            extractBtn.innerHTML = '<i class="fas fa-unlock-alt"></i> Extract All';
                                            setTimeout(resetStatus, 2500);
                                            setTimeout(() => {
                                                progressContainer.classList.remove('show');
                                            }, 1500);
                                        }
                                    });
                                } else {
                                    loaded++;
                                    const percent = Math.round((loaded / total) * 100);
                                    progressFill.style.width = percent + '%';
                                    progressPercent.textContent = percent + '%';
                                    if (loaded === total) {
                                        renderFileList(extractedFiles);
                                        if (extractedFiles.length > 0) {
                                            downloadAllBtn.disabled = false;
                                            downloadAllBtn.innerHTML = '<i class="fas fa-download"></i> Download All (' + extractedFiles.length + ' files)';
                                        }
                                        updateStatus(`<i class="fas fa-check-circle" style="color:#10b981;"></i> Extracted ${extractedFiles.length} files successfully!`, 'success');
                                        extractBtn.disabled = false;
                                        extractBtn.innerHTML = '<i class="fas fa-unlock-alt"></i> Extract All';
                                        setTimeout(resetStatus, 2500);
                                        setTimeout(() => {
                                            progressContainer.classList.remove('show');
                                        }, 1500);
                                    }
                                }
                            });
                        })
                        .catch(function(err) {
                            updateStatus('<i class="fas fa-times-circle" style="color:#fda085;"></i> Error: Invalid ZIP file - ' + err.message, 'error');
                            extractBtn.disabled = false;
                            extractBtn.innerHTML = '<i class="fas fa-unlock-alt"></i> Extract All';
                            progressContainer.classList.remove('show');
                            setTimeout(resetStatus, 3000);
                        });
                } catch (err) {
                    updateStatus('<i class="fas fa-times-circle" style="color:#fda085;"></i> Error: ' + err.message, 'error');
                    extractBtn.disabled = false;
                    extractBtn.innerHTML = '<i class="fas fa-unlock-alt"></i> Extract All';
                    progressContainer.classList.remove('show');
                    setTimeout(resetStatus, 3000);
                }
            };
            reader.onerror = function() {
                updateStatus('<i class="fas fa-times-circle" style="color:#fda085;"></i> Failed to read file', 'error');
                extractBtn.disabled = false;
                extractBtn.innerHTML = '<i class="fas fa-unlock-alt"></i> Extract All';
                progressContainer.classList.remove('show');
                setTimeout(resetStatus, 2000);
            };
            reader.readAsArrayBuffer(currentFile);
        });

        downloadAllBtn.addEventListener('click', function() {
            if (extractedFiles.length === 0) {
                updateStatus('<i class="fas fa-exclamation-circle" style="color:#fda085;"></i> No files to download', 'error');
                setTimeout(resetStatus, 2000);
                return;
            }

            updateStatus(`<i class="fas fa-download" style="color:#10b981;"></i> Downloading ${extractedFiles.length} files...`, 'info');

            extractedFiles.forEach(function(file, index) {
                setTimeout(function() {
                    downloadSingleFile(file);
                    if (index === extractedFiles.length - 1) {
                        updateStatus(`<i class="fas fa-check-circle" style="color:#10b981;"></i> Downloaded ${extractedFiles.length} files successfully!`, 'success');
                        setTimeout(resetStatus, 2500);
                    }
                }, index * 300);
            });
        });

        resetAll();
        console.log('✨ Unzip Files · Sandesh style');
        console.log('💡 अब हर फाइल अपने असली फॉर्मेट में डाउनलोड होगी');
    })();
</script>
</body>
</html>
