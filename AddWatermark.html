<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Watermark to Image Online</title>
    <!-- ✅ FAVICON - Folder ke andar wali files -->
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-purple: #7c3aed;
            --light-purple-bg: #f3f0ff;
            --border-purple: #d8b4fe;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --success-green: #6ee7b7;
            --success-hover: #34d399;
            --btn-shadow: 0 4px 6px -1px rgba(124, 58, 237, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            background-image: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--text-dark);
        }

        /* ---------- HOME BUTTON ---------- */
        .home-btn-wrapper {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            color: var(--primary-purple);
            border: 2px solid var(--border-purple);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(124, 58, 237, 0.15);
        }

        .home-btn:hover {
            background: var(--primary-purple);
            color: white;
            border-color: var(--primary-purple);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.35);
        }

        .home-btn i {
            font-size: 15px;
        }

        /* Top Header Styling */
        .page-header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        .page-header h1 {
            font-size: 28px;
            color: var(--text-dark);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .page-header p.subtitle {
            color: var(--text-light);
            font-size: 15px;
            background: white;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Main Card Container */
        .main-card {
            background: white;
            width: 100%;
            max-width: 900px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05), 0 0 0 1px rgba(124, 58, 237, 0.1);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        /* --- Upload Section Styling --- */
        #uploadSection {
            border: 2px dashed var(--border-purple);
            background-color: #faf5ff;
            border-radius: 16px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        #uploadSection:hover {
            background-color: #f3e8ff;
            border-color: var(--primary-purple);
        }

        .folder-icon {
            font-size: 48px;
            color: var(--primary-purple);
            margin-bottom: 15px;
            display: block;
        }

        .upload-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .upload-subtitle {
            font-size: 14px;
            color: var(--text-light);
            background: white;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
        }

        #fileInput {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* --- Main App Container (Initially Hidden) --- */
        .container {
            display: none; /* Chhupa hua hai, upload ke baad dikhega */
            gap: 20px;
            width: 100%;
        }

        /* Left Side - Image Area */
        .image-area {
            flex: 2;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            min-height: 400px;
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            background: white;
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
        }

        /* Right Side - Controls */
        .controls {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: #f8fafc;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary-purple);
            margin-bottom: 5px;
            display: block;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        select {
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            background: white;
            cursor: pointer;
            width: 100%;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-add {
            background-color: var(--primary-purple);
            color: white;
            box-shadow: var(--btn-shadow);
            white-space: nowrap;
        }

        .btn-add:hover {
            background-color: #6d28d9;
            transform: translateY(-1px);
        }

        .btn-download {
            background-color: var(--success-green);
            color: white;
            width: 100%;
            margin-top: auto;
            padding: 14px;
            font-size: 16px;
            box-shadow: 0 4px 6px -1px rgba(52, 211, 153, 0.4);
        }

        .btn-download:hover {
            background-color: var(--success-hover);
            transform: translateY(-2px);
        }

        /* Color Palette */
        .color-palette {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .color-box {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }
        
        .color-box:hover {
            transform: scale(1.15);
            border-color: #333;
        }

        /* Range and Number Inputs */
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
        }
        
        .range-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .range-control button {
            background: var(--light-purple-bg);
            color: var(--primary-purple);
            border: 1px solid var(--border-purple);
            width: 28px;
            height: 28px;
            padding: 0;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
        }

        .range-control button:hover {
            background: var(--primary-purple);
            color: white;
        }

        .range-control input[type="number"] {
            width: 45px;
            text-align: center;
            border: none;
            font-weight: bold;
            color: var(--primary-purple);
            background: transparent;
            font-size: 14px;
        }

        /* Footer */
        .footer {
            margin-top: 30px;
            text-align: center;
            color: var(--primary-purple);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding-top: 70px;
            }

            .home-btn-wrapper {
                top: 12px;
                right: 12px;
            }

            .home-btn {
                padding: 8px 16px;
                font-size: 13px;
            }

            .container {
                flex-direction: column;
                height: auto;
            }
            .image-area {
                height: 300px;
                min-height: 300px;
            }
            canvas {
                max-height: 250px;
            }
            .controls {
                min-width: unset;
            }
        }
    </style>
</head>
<body>

    <!-- HOME BUTTON -->
    <div class="home-btn-wrapper">
        <a href="index.html" class="home-btn">
            <i class="fas fa-home"></i> Home
        </a>
    </div>

    <!-- Header Section -->
    <div class="page-header">
        <h1>Add Watermark to Image Online</h1>
        <p class="subtitle">Upload an image and add your custom watermark</p>
    </div>

    <!-- Main Card -->
    <div class="main-card">
        
    
        <div id="uploadSection" onclick="document.getElementById('fileInput').click()">
            <div class="folder-icon">
                <i class="fas fa-cloud-upload-alt"></i>
            </div>
            <div class="upload-title">Drop image here or click</div>
            <div class="upload-subtitle">Supported formats: JPG, PNG</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>


        <div class="container" id="editorContainer">
            <!-- Left Side: Canvas -->
            <div class="image-area">
                <div class="canvas-container">
                    <canvas id="canvas"></canvas>
                </div>
            </div>

            <!-- Right Side: Controls -->
            <div class="controls">
                <span class="section-title">Watermark Text</span>
                
                <div class="input-group">
                    <input type="text" id="watermarkText" placeholder="Enter Text" value="Sample Text">
                    <button class="btn-add" onclick="addText()"><i class="fas fa-plus"></i> Add</button>
                </div>

                <!-- Controls for Text -->
                <div id="textControls">
                    <span class="section-title" style="margin-top: 10px;">Text Settings</span>
                    
                    <div class="row">
                        <label>Font Family</label>
                        <select id="fontFamily" onchange="updateTextProps()">
                            <option value="Arial">Arial</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Courier New">Courier New</option>
                            <option value="Verdana">Verdana</option>
                        </select>
                    </div>

                    <div class="row" style="margin-top: 8px;">
                        <label>Font Size</label>
                        <div class="range-control">
                            <button onclick="changeSize(-2)">-</button>
                            <input type="number" id="fontSize" value="40" readonly>
                            <button onclick="changeSize(2)">+</button>
                        </div>
                    </div>

                    <div class="row" style="margin-top: 8px;">
                        <label>Opacity</label>
                        <div class="range-control">
                            <button onclick="changeOpacity(-0.1)">-</button>
                            <input type="number" id="opacity" value="1" step="0.1" readonly>
                            <button onclick="changeOpacity(0.1)">+</button>
                        </div>
                    </div>

                    <span class="section-title" style="margin-top: 15px;">Font Color</span>
                    <div class="color-palette" id="fontColors">
                        <div class="color-box" style="background: #000080;" onclick="setColor('#000080')"></div>
                        <div class="color-box" style="background: #FF69B4;" onclick="setColor('#FF69B4')"></div>
                        <div class="color-box" style="background: #8A2BE2;" onclick="setColor('#8A2BE2')"></div>
                        <div class="color-box" style="background: #00BFFF;" onclick="setColor('#00BFFF')"></div>
                        <div class="color-box" style="background: #32CD32;" onclick="setColor('#32CD32')"></div>
                        <div class="color-box" style="background: #FFD700;" onclick="setColor('#FFD700')"></div>
                        <div class="color-box" style="background: #FF0000;" onclick="setColor('#FF0000')"></div>
                    </div>
                    
                    <span class="section-title" style="margin-top: 15px;">Background Color</span>
                    <div class="color-palette" id="bgColors">
                        <div class="color-box" style="background: #008000;" onclick="setBgColor('#008000')"></div>
                        <div class="color-box" style="background: #8B0000;" onclick="setBgColor('#8B0000')"></div>
                        <div class="color-box" style="background: #A0522D;" onclick="setBgColor('#A0522D')"></div>
                        <div class="color-box" style="background: #808080;" onclick="setBgColor('#808080')"></div>
                        <div class="color-box" style="background: #ADD8E6;" onclick="setBgColor('#ADD8E6')"></div>
                        <div class="color-box" style="background: transparent; border: 1px solid #ccc;" onclick="setBgColor('transparent')"></div>
                    </div>
                </div>

                <button class="btn-download" onclick="downloadImage()">
                    <i class="fas fa-download"></i> Download Image
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <i class="fa-solid fa-heart"></i> Made with Love · Create by Sandesh <i class="fa-solid fa-heart"></i>
    </div>

    <!-- Fabric.js Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    
    <script>
        // Global Canvas Variable
        let canvas = null;
        let textObject = null;

        // 1. FILE UPLOAD LOGIC
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const imgUrl = event.target.result;

                // Hide upload section, Show Editor
                document.getElementById('uploadSection').style.display = 'none';
                document.getElementById('editorContainer').style.display = 'flex';

                // Initialize Canvas if not already done
                if (!canvas) {
                    canvas = new fabric.Canvas('canvas');
                    setupFabricEvents();
                }

                // Load Image into Canvas
                fabric.Image.fromURL(imgUrl, function(img) {
                    // Auto-scale image to fit the canvas area
                    const maxWidth = 500;
                    const maxHeight = 500;
                    
                    let scale = 1;
                    if (img.width > maxWidth || img.height > maxHeight) {
                        scale = Math.min(maxWidth / img.width, maxHeight / img.height);
                    }
                    
                    canvas.setWidth(img.width * scale);
                    canvas.setHeight(img.height * scale);
                    
                    img.scale(scale);
                    canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas));
                    
                    // Add initial text automatically
                    addText(); 
                });
            };
            reader.readAsDataURL(file);
        });

        // 2. TEXT ADD FUNCTION
        function addText() {
            if(!canvas) return;
            
            const textVal = document.getElementById('watermarkText').value;
            
            // Remove old text if exists
            if (textObject) {
                canvas.remove(textObject);
            }

            textObject = new fabric.Text(textVal || "Watermark", {
                left: canvas.width / 2,
                top: canvas.height / 2,
                fontSize: parseInt(document.getElementById('fontSize').value),
                fontFamily: document.getElementById('fontFamily').value,
                fill: '#000080', // Default blue
                originX: 'center',
                originY: 'center',
                transparentCorners: false,
                cornerColor: 'blue',
                cornerSize: 10,
                padding: 5
            });
            
            canvas.add(textObject);
            canvas.setActiveObject(textObject);
            canvas.renderAll();
        }

        // 3. UPDATE PROPERTIES
        function updateTextProps() {
            if (!textObject) return;
            textObject.set('fontFamily', document.getElementById('fontFamily').value);
            canvas.renderAll();
        }

        function changeSize(amount) {
            if (!textObject) return;
            const input = document.getElementById('fontSize');
            let newVal = parseInt(input.value) + amount;
            if (newVal < 10) newVal = 10;
            input.value = newVal;
            textObject.set('fontSize', newVal);
            canvas.renderAll();
        }

        function changeOpacity(amount) {
            if (!textObject) return;
            const input = document.getElementById('opacity');
            let newVal = parseFloat(input.value) + amount;
            if (newVal < 0) newVal = 0;
            if (newVal > 1) newVal = 1;
            input.value = newVal.toFixed(1);
            textObject.set('opacity', newVal);
            canvas.renderAll();
        }

        function setColor(color) {
            if (!textObject) return;
            textObject.set('fill', color);
            canvas.renderAll();
        }

        function setBgColor(color) {
            if (!textObject) return;
            if(color === 'transparent') {
                textObject.set('backgroundColor', '');
            } else {
                textObject.set('backgroundColor', color);
            }
            canvas.renderAll();
        }

        // 4. DOWNLOAD FUNCTION
        function downloadImage() {
            if (!canvas) return;
            
            // Deselect object so selection border isn't saved
            canvas.discardActiveObject();
            canvas.renderAll();

            const dataURL = canvas.toDataURL({
                format: 'png',
                quality: 1
            });

            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'watermarked_image.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        function setupFabricEvents() {
            window.addText = addText;
            window.updateTextProps = updateTextProps;
            window.changeSize = changeSize;
            window.changeOpacity = changeOpacity;
            window.setColor = setColor;
            window.setBgColor = setBgColor;
            window.downloadImage = downloadImage;
        }

    
        setupFabricEvents();
    </script>
</body>
</html>
