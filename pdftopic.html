<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>PDF to Image Converter</title>
    <!-- ✅ FAVICON -->
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f8f0ff 0%, #f0e6ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        /* ---------- HOME BUTTON ---------- */
        .home-btn-wrapper {
            position: fixed;
            top: 28px;
            right: 32px;
            z-index: 999;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            color: #6a3de8;
            border: 2px solid #c9b0ff;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(106, 61, 232, 0.15);
            letter-spacing: 0.3px;
        }

        .home-btn:hover {
            background: #6a3de8;
            color: white;
            border-color: #6a3de8;
            transform: translateY(-3px);
            box-shadow: 0 16px 30px rgba(106, 61, 232, 0.4);
        }

        .home-btn i {
            font-size: 1.1rem;
        }

        .card {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 56px 56px 48px 48px;
            padding: 2.6rem 2.8rem 3rem;
            box-shadow: 0 30px 60px -15px rgba(90, 40, 140, 0.25),
                        0 0 0 1px rgba(200, 170, 255, 0.25) inset;
            border: 1px solid rgba(220, 200, 255, 0.4);
            transition: all 0.2s ease;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .brand i {
            font-size: 2.8rem;
            color: #6a3de8;
            filter: drop-shadow(0 4px 8px rgba(106, 61, 232, 0.2));
        }

        .brand h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #2c1a4e;
            letter-spacing: -0.5px;
        }

        .brand h1 small {
            font-size: 0.9rem;
            font-weight: 500;
            background: #ede4ff;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            color: #5b3b9e;
            margin-left: 0.4rem;
        }

        .header-badge {
            background: white;
            border: 1px solid #d9c8ff;
            padding: 0.6rem 1.8rem;
            border-radius: 80px;
            font-weight: 600;
            color: #3b1f7a;
            box-shadow: 0 6px 16px rgba(106, 61, 232, 0.08);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1.1rem;
        }

        .header-badge i {
            color: #6a3de8;
            font-size: 1.2rem;
        }

        /* drop zone */
        .drop-zone {
            background: rgba(245, 238, 255, 0.6);
            border: 2.5px dashed #c9b0ff;
            border-radius: 40px;
            padding: 2.8rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: background 0.25s, border 0.25s, transform 0.15s;
            margin-bottom: 2rem;
            box-shadow: 0 4px 12px rgba(106, 61, 232, 0.06);
        }

        .drop-zone:hover {
            background: #f3ecff;
            border-color: #a884ff;
        }

        .drop-zone:active {
            transform: scale(0.98);
        }

        .drop-zone input {
            display: none;
        }

        .drop-icon {
            font-size: 4rem;
            line-height: 1;
            filter: drop-shadow(0 4px 8px rgba(106, 61, 232, 0.15));
        }

        .drop-text {
            font-size: 1.4rem;
            font-weight: 600;
            color: #2c1a4e;
            margin: 0.6rem 0 0.4rem;
        }

        .drop-hint {
            color: #6a4f9e;
            font-size: 1rem;
            background: #ede4ff;
            display: inline-block;
            padding: 0.3rem 1.8rem;
            border-radius: 30px;
            font-weight: 500;
        }

        /* file status */
        .file-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            padding: 0.8rem 1.6rem;
            background: #f8f2ff;
            border-radius: 60px;
            border: 1px solid #e0d0ff;
            margin-bottom: 1.4rem;
            color: #3b1f7a;
            font-weight: 500;
            font-size: 1.05rem;
        }

        .file-status i {
            color: #6a3de8;
            font-size: 1.3rem;
        }

        .file-status .file-name {
            background: #ede4ff;
            padding: 0.2rem 1.4rem;
            border-radius: 30px;
            font-weight: 600;
            max-width: 320px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin: 1.4rem 0 2rem;
        }

        .btn {
            border: none;
            padding: 1rem 2.4rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            min-width: 180px;
            box-shadow: 0 6px 14px rgba(106, 61, 232, 0.1);
            border: 1px solid #d9c8ff;
        }

        .btn-primary {
            background: #6a3de8;
            color: white;
            border-color: #7b4cff;
            box-shadow: 0 8px 20px rgba(106, 61, 232, 0.3);
        }

        .btn-primary:hover {
            background: #4a27b0;
            transform: scale(0.97);
            box-shadow: 0 6px 16px rgba(74, 39, 176, 0.35);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        .btn-success {
            background: #10b981;
            color: white;
            border-color: #34d399;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover {
            background: #059669;
            transform: scale(0.97);
        }

        .btn-success:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        /* reorder hint */
        .reorder-hint {
            text-align: center;
            color: #6a4f9e;
            font-size: 0.95rem;
            font-weight: 500;
            margin: 0.4rem 0 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: #f3ecff;
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid #e0d0ff;
        }

        .reorder-hint i {
            color: #6a3de8;
        }

        /* gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .card-item {
            background: white;
            border-radius: 32px;
            padding: 1.4rem 1.2rem 1.2rem;
            box-shadow: 0 12px 28px -10px rgba(80, 40, 160, 0.15);
            transition: all 0.25s ease;
            border: 1px solid rgba(200, 175, 255, 0.3);
            display: flex;
            flex-direction: column;
            cursor: grab;
            user-select: none;
        }

        .card-item:active {
            cursor: grabbing;
        }

        .card-item.dragging {
            opacity: 0.5;
            background: #ede4ff;
            box-shadow: 0 8px 20px rgba(106, 61, 232, 0.2);
        }

        .card-item.drag-over {
            border-top: 4px solid #6a3de8;
        }

        .card-item:hover {
            transform: translateY(-6px);
            border-color: #a884ff;
            box-shadow: 0 22px 38px -14px #6a3de880;
        }

        .card-item .page-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #3b1f7a;
            background: #ede4ff;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            align-self: flex-start;
            margin-bottom: 0.8rem;
            border: 1px solid #d5c2ff;
        }

        .card-item .page-label .drag-icon {
            color: #b8a0e0;
            font-size: 0.9rem;
            cursor: grab;
        }

        .card-item .page-label .drag-icon:hover {
            color: #6a3de8;
        }

        .card-item canvas {
            width: 100%;
            aspect-ratio: 1 / 1.4;
            border-radius: 20px;
            background: #f6f0ff;
            object-fit: contain;
            border: 1px solid #e7dcff;
        }

        .card-item .download-btn {
            width: 100%;
            margin-top: 1rem;
            padding: 0.7rem;
            border: none;
            border-radius: 60px;
            background: #ede4ff;
            color: #3b1f7a;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #d9c8ff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .card-item .download-btn i {
            color: #6a3de8;
        }

        .card-item .download-btn:hover {
            background: #6a3de8;
            color: white;
            border-color: #6a3de8;
        }

        .card-item .download-btn:hover i {
            color: white;
        }

        /* status message */
        .status-msg {
            text-align: center;
            margin-top: 1.4rem;
            font-weight: 500;
            color: #3b1f7a;
            background: #f3ecff;
            padding: 0.8rem 1.2rem;
            border-radius: 60px;
            font-size: 1rem;
            border: 1px solid #e0d0ff;
            transition: 0.2s;
        }

        .status-msg.success {
            background: #d8ebd2;
            border-color: #9fc7a0;
            color: #1c4827;
        }

        .status-msg.error {
            background: #ffe1d6;
            border-color: #e7b6a4;
            color: #7d3f2b;
        }

        .footer-love {
            margin-top: 2.2rem;
            text-align: center;
            font-size: 1rem;
            color: #7a5fa8;
            letter-spacing: 0.3px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .footer-love i {
            color: #6a3de8;
            font-size: 1.1rem;
        }

        @media (max-width: 600px) {
            .home-btn-wrapper { top: 16px; right: 16px; }
            .home-btn { padding: 8px 18px; font-size: 0.9rem; }
            .card { padding: 1.8rem; }
            .brand h1 { font-size: 1.8rem; }
            .brand i { font-size: 2.2rem; }
            .drop-zone { padding: 2rem 1.2rem; }
            .drop-icon { font-size: 3rem; }
            .drop-text { font-size: 1.2rem; }
            .btn { min-width: 140px; padding: 0.8rem 1.6rem; font-size: 1rem; }
            .header { flex-direction: column; align-items: flex-start; }
            .header-badge { font-size: 0.95rem; padding: 0.4rem 1.2rem; }
            .gallery { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
            .file-status { font-size: 0.9rem; padding: 0.6rem 1rem; }
            .file-status .file-name { max-width: 160px; }
        }
    </style>
</head>
<body>

<!-- HOME BUTTON -->
<div class="home-btn-wrapper">
    <a href="index.html" class="home-btn">
        <i class="fas fa-home"></i> Home
    </a>
</div>

<div class="card">
    <!-- header -->
    <div class="header">
        <div class="brand">
            <i class="fas fa-image"></i>
            <h1>
                PDF to Image
                <small>converter</small>
            </h1>
        </div>
        <div class="header-badge">
            <i class="fas fa-star"></i> PNG · High Quality
        </div>
    </div>

    <!-- drop zone -->
    <div class="drop-zone" id="dropZone">
        <input type="file" id="pdfFile" accept=".pdf" />
        <div class="drop-icon">📂</div>
        <div class="drop-text">Drop PDF here or click</div>
        <div class="drop-hint">.pdf only · convert to PNG</div>
    </div>

    <!-- file status -->
    <div class="file-status" id="fileStatus">
        <i class="fas fa-file-pdf"></i>
        <span>Selected:</span>
        <span class="file-name" id="fileNameDisplay">no file chosen</span>
    </div>

    <!-- controls -->
    <div class="controls">
        <button class="btn btn-primary" id="convertBtn"><i class="fas fa-sync-alt"></i> Convert PDF</button>
        <button class="btn btn-success" id="downloadAllBtn"><i class="fas fa-download"></i> Download All</button>
    </div>

    <!-- reorder hint -->
    <div class="reorder-hint" id="reorderHint" style="display: none;">
        <i class="fas fa-arrows-alt-v"></i> Drag pages to reorder before downloading
    </div>

    <!-- gallery -->
    <div class="gallery" id="gallery"></div>

    <!-- status message -->
    <div class="status-msg" id="statusMsg">📌 ready to convert</div>

    <div class="footer-love">
        <i class="fas fa-heart"></i> Made with Love · Create by Sandesh <i class="fas fa-heart"></i>
    </div>
</div>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
    (function() {
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        const input = document.getElementById("pdfFile");
        const dropZone = document.getElementById("dropZone");
        const gallery = document.getElementById("gallery");
        const convertBtn = document.getElementById("convertBtn");
        const downloadAllBtn = document.getElementById("downloadAllBtn");
        const fileNameDisplay = document.getElementById("fileNameDisplay");
        const statusMsg = document.getElementById("statusMsg");
        const reorderHint = document.getElementById("reorderHint");

        let pdfFile = null;
        let pages = []; // store { dataUrl, canvas }
        let dragIndex = null;

        function updateStatus(text, className = '') {
            statusMsg.textContent = text;
            statusMsg.className = 'status-msg' + (className ? ' ' + className : '');
        }

        function resetStatus() {
            updateStatus('📌 ready to convert', '');
        }

        function updateFileStatus() {
            fileNameDisplay.textContent = pdfFile ? pdfFile.name : 'no file chosen';
        }

        function updateReorderHint() {
            reorderHint.style.display = pages.length > 1 ? 'flex' : 'none';
        }

        // --- drag & drop ---
        dropZone.onclick = () => input.click();

        input.onchange = (e) => {
            if (e.target.files.length > 0) {
                pdfFile = e.target.files[0];
                updateFileStatus();
                resetStatus();
                gallery.innerHTML = '';
                pages = [];
                downloadAllBtn.disabled = true;
                updateReorderHint();
            }
        };

        dropZone.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropZone.style.background = "#f3ecff";
            dropZone.style.borderColor = "#a884ff";
        });

        dropZone.addEventListener("dragleave", () => {
            dropZone.style.background = "rgba(245, 238, 255, 0.6)";
            dropZone.style.borderColor = "#c9b0ff";
        });

        dropZone.addEventListener("drop", (e) => {
            e.preventDefault();
            dropZone.style.background = "rgba(245, 238, 255, 0.6)";
            dropZone.style.borderColor = "#c9b0ff";
            if (e.dataTransfer.files.length > 0) {
                const file = e.dataTransfer.files[0];
                if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                    pdfFile = file;
                    updateFileStatus();
                    resetStatus();
                    gallery.innerHTML = '';
                    pages = [];
                    downloadAllBtn.disabled = true;
                    updateReorderHint();
                } else {
                    updateStatus('⚠️ Please drop a PDF file', 'error');
                    setTimeout(resetStatus, 2000);
                }
            }
        });

        // --- render gallery ---
        function renderGallery() {
            gallery.innerHTML = '';
            pages.forEach((page, index) => {
                const card = document.createElement('div');
                card.className = 'card-item';
                card.draggable = true;
                card.dataset.index = index;

                const label = document.createElement('span');
                label.className = 'page-label';
                label.innerHTML = `<i class="fas fa-grip-vertical drag-icon"></i> Page ${index + 1}`;
                card.appendChild(label);

                const canvas = document.createElement('canvas');
                canvas.width = page.canvas.width;
                canvas.height = page.canvas.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(page.canvas, 0, 0);
                card.appendChild(canvas);

                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'download-btn';
                downloadBtn.innerHTML = `<i class="fas fa-arrow-down"></i> Download Page ${index + 1}`;
                downloadBtn.onclick = (e) => {
                    e.stopPropagation();
                    download(page.dataUrl, `Page-${index + 1}.png`);
                };
                card.appendChild(downloadBtn);

                // Drag events
                card.addEventListener('dragstart', function(e) {
                    dragIndex = parseInt(this.dataset.index, 10);
                    this.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', dragIndex);
                });

                card.addEventListener('dragend', function() {
                    this.classList.remove('dragging');
                    document.querySelectorAll('.card-item').forEach(el => el.classList.remove('drag-over'));
                });

                card.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    this.classList.add('drag-over');
                });

                card.addEventListener('dragleave', function() {
                    this.classList.remove('drag-over');
                });

                card.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.classList.remove('drag-over');
                    const fromIndex = dragIndex !== null ? dragIndex : parseInt(e.dataTransfer.getData('text/plain'), 10);
                    const toIndex = parseInt(this.dataset.index, 10);

                    if (isNaN(fromIndex) || isNaN(toIndex) || fromIndex === toIndex) return;

                    const movedPage = pages.splice(fromIndex, 1)[0];
                    pages.splice(toIndex, 0, movedPage);
                    dragIndex = null;
                    renderGallery();
                    updateStatus(`🔄 order updated · page moved to position ${toIndex + 1}`, '');
                });

                gallery.appendChild(card);
            });
            updateReorderHint();
        }

        // --- convert ---
        async function convertPDF() {
            if (!pdfFile) {
                updateStatus('❌ Please select a PDF first', 'error');
                setTimeout(resetStatus, 2000);
                return;
            }

            try {
                convertBtn.disabled = true;
                convertBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Converting...';
                updateStatus('🔄 converting pages...', '');

                gallery.innerHTML = '';
                pages = [];

                const buffer = await pdfFile.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(buffer).promise;
                const totalPages = pdf.numPages;

                for (let i = 1; i <= totalPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 2 });
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    await page.render({
                        canvasContext: ctx,
                        viewport: viewport
                    }).promise;

                    const imgData = canvas.toDataURL('image/png');
                    pages.push({ dataUrl: imgData, canvas: canvas });
                }

                renderGallery();
                downloadAllBtn.disabled = false;
                updateStatus(`✅ converted ${totalPages} page${totalPages > 1 ? 's' : ''}`, 'success');
                setTimeout(resetStatus, 2500);

            } catch (error) {
                console.error('Conversion error:', error);
                updateStatus('❌ Conversion failed: ' + (error.message || 'unknown error'), 'error');
            } finally {
                convertBtn.disabled = false;
                convertBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Convert PDF';
            }
        }

        // --- download helpers ---
        function download(data, name) {
            const a = document.createElement('a');
            a.href = data;
            a.download = name;
            a.click();
        }

        function downloadAll() {
            if (pages.length === 0) {
                updateStatus('❌ No images to download. Convert first.', 'error');
                setTimeout(resetStatus, 2000);
                return;
            }
            pages.forEach((page, index) => {
                setTimeout(() => {
                    download(page.dataUrl, `Page-${index + 1}.png`);
                }, index * 300);
            });
            updateStatus(`⬇️ downloading ${pages.length} images...`, 'success');
            setTimeout(resetStatus, 2000);
        }

        // --- event listeners ---
        convertBtn.addEventListener('click', convertPDF);
        downloadAllBtn.addEventListener('click', downloadAll);

        // initial state
        downloadAllBtn.disabled = true;
        updateFileStatus();
        resetStatus();
        updateReorderHint();

        console.log('✨ PDF to Image Converter · Sandesh style');
    })();
</script>
</body>
</html>
