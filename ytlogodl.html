<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Thumbnail Downloader</title>

    <!-- ✅ FAVICON -->
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-purple: #7c3aed;
            --light-purple-bg: #f3f0ff;
            --border-purple: #d8b4fe;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --success-green: #6ee7b7;
            --success-hover: #34d399;
            --btn-shadow: 0 4px 6px -1px rgba(124, 58, 237, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body { min-height: 100%; }

        body {
            background-color: #f3f4f6;
            background-image: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            color: var(--text-dark);
        }

        /* ---------- HOME BUTTON ---------- */
        .home-btn-wrapper {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            color: var(--primary-purple);
            border: 2px solid var(--border-purple);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(124, 58, 237, 0.15);
        }

        .home-btn:hover {
            background: var(--primary-purple);
            color: white;
            border-color: var(--primary-purple);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.35);
        }

        .home-btn i { font-size: 15px; }

        /* ---------- PAGE SHELL ---------- */
        .page-shell {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        /* Main Card Container */
        .main-card {
            background: white;
            width: 100%;
            max-width: 580px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08), 0 0 0 1px rgba(124, 58, 237, 0.1);
            padding: 35px 30px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* Header */
        .page-header {
            text-align: center;
        }

        .page-header h1 {
            font-size: 24px;
            color: var(--text-dark);
            margin-bottom: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .page-header h1 i {
            color: #ff0000;
            font-size: 26px;
        }

        .page-header p.subtitle {
            color: var(--text-light);
            font-size: 14px;
            background: var(--light-purple-bg);
            padding: 8px 18px;
            border-radius: 30px;
            display: inline-block;
            font-weight: 600;
            border: 1px solid var(--border-purple);
            line-height: 1.4;
        }

        /* Input Row */
        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .input-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-purple);
            font-size: 15px;
            pointer-events: none;
        }

        #urlInput {
            width: 100%;
            padding: 15px 18px 15px 48px;
            border: 2px dashed var(--border-purple);
            background: #faf5ff;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s;
        }

        #urlInput::placeholder {
            color: #a78bfa;
            font-weight: 500;
        }

        #urlInput:focus {
            border-color: var(--primary-purple);
            border-style: solid;
            background: white;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        #fetchBtn {
            padding: 15px 28px;
            border: none;
            border-radius: 30px;
            background-color: var(--primary-purple);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--btn-shadow);
            white-space: nowrap;
        }

        #fetchBtn:hover:not(:disabled) {
            background-color: #6d28d9;
            transform: translateY(-2px);
        }

        #fetchBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Status Messages */
        .status {
            margin-top: 5px;
            font-size: 14px;
            min-height: 42px;
            display: none;
            padding: 12px 18px;
            border-radius: 14px;
            font-weight: 700;
            text-align: center;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status.loading {
            display: flex;
            background: var(--light-purple-bg);
            color: var(--primary-purple);
            border: 1px solid var(--border-purple);
        }

        .status.downloading {
            display: flex;
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        .status.ready {
            display: flex;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .status.error {
            display: flex;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(124, 58, 237, 0.2);
            border-top-color: var(--primary-purple);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Preview Card */
        .preview {
            display: none;
            margin-top: 5px;
            padding: 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            animation: slideDown 0.3s ease;
        }

        .preview.active { display: block; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .preview-label {
            font-size: 12px;
            color: var(--primary-purple);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
        }

        .preview img {
            width: 100%;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.15);
            border: 3px solid white;
            display: block;
        }

        .download-btn {
            margin-top: 18px;
            width: 100%;
            padding: 16px 30px;
            border: none;
            border-radius: 30px;
            background-color: var(--success-green);
            color: #166534;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(52, 211, 153, 0.4);
        }

        .download-btn:hover:not(:disabled) {
            background-color: var(--success-hover);
            color: white;
            transform: translateY(-2px);
        }

        .download-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Footer */
        .footer {
            margin-top: 10px;
            text-align: center;
            color: var(--primary-purple);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        /* ================================================
           ✅ DESKTOP FULL SCREEN FIT (900px and above)
           ================================================ */
        @media (min-width: 900px) {
            body {
                padding: 40px 30px;
                align-items: center;
                justify-content: center;
            }

            .page-shell {
                max-width: 1300px;
                gap: 25px;
            }

            .main-card {
                max-width: 720px;
                padding: 50px 55px;
                gap: 28px;
                border-radius: 28px;
            }

            .page-header h1 { font-size: 32px; }
            .page-header h1 i { font-size: 34px; }
            .page-header p.subtitle {
                font-size: 15px;
                padding: 10px 24px;
            }

            #urlInput {
                font-size: 16px;
                padding: 18px 22px 18px 54px;
                border-radius: 18px;
            }

            .input-wrapper i { font-size: 17px; left: 20px; }

            #fetchBtn {
                padding: 18px 38px;
                font-size: 16px;
                border-radius: 34px;
            }

            .status {
                font-size: 15px;
                padding: 15px 22px;
                min-height: 50px;
            }

            .preview { padding: 26px; }

            .preview-label { font-size: 13px; }

            .preview img { border-radius: 16px; }

            .download-btn {
                padding: 18px 38px;
                font-size: 16px;
                border-radius: 34px;
            }

            .footer { font-size: 15px; margin-top: 20px; }
        }

        /* ✅ LARGE DESKTOP (1200px+) */
        @media (min-width: 1200px) {
            .main-card {
                max-width: 800px;
                padding: 55px 65px;
            }

            .page-header h1 { font-size: 36px; }
            .page-header h1 i { font-size: 38px; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            body { padding-top: 75px; }
            .home-btn-wrapper { top: 12px; right: 12px; }
            .home-btn { padding: 8px 16px; font-size: 13px; }
        }

        @media (max-width: 550px) {
            .main-card { padding: 25px 18px; border-radius: 20px; }
            .page-header h1 { font-size: 20px; }
            .input-group { flex-direction: column; }
            #fetchBtn { width: 100%; justify-content: center; }
            .download-btn { font-size: 14px; padding: 14px; }
        }
    </style>
</head>
<body>

    <!-- HOME BUTTON -->
    <div class="home-btn-wrapper">
        <a href="index.html" class="home-btn">
            <i class="fas fa-home"></i> Home
        </a>
    </div>

    <div class="page-shell">
        <div class="main-card">
            <!-- Header -->
            <div class="page-header">
                <h1>
                    <i class="fab fa-youtube"></i>
                    YT Thumbnail Downloader
                </h1>
                <p class="subtitle">YouTube video ka link daalein aur thumbnail PNG me download karein</p>
            </div>

            <!-- Input Row -->
            <div class="input-group">
                <div class="input-wrapper">
                    <i class="fas fa-link"></i>
                    <input type="text" id="urlInput" placeholder="https://youtube.com/watch?v=..." />
                </div>
                <button id="fetchBtn" onclick="fetchThumbnail()">
                    <i class="fas fa-search"></i> Fetch
                </button>
            </div>

            <!-- Status -->
            <div class="status" id="status"></div>

            <!-- Preview -->
            <div class="preview" id="preview">
                <div class="preview-label">
                    <i class="fas fa-image"></i> Thumbnail Preview
                </div>
                <img id="thumbImg" src="" alt="Thumbnail Preview" />
                <button class="download-btn" id="downloadBtn" onclick="downloadImage()">
                    <i class="fas fa-download"></i> Download PNG
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <i class="fa-solid fa-heart"></i> Made with Love · Create by Lite Pro Tools <i class="fa-solid fa-heart"></i>
        </div>
    </div>

    <script>
        let currentThumbUrl = '';

        function extractVideoId(url) {
            if (!url) return null;
            url = url.trim();

            if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;

            const patterns = [
                /(?:youtube\.com\/watch\?v=)([a-zA-Z0-9_-]{11})/,
                /(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/,
                /(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
                /(?:youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
                /(?:youtube\.com\/v\/)([a-zA-Z0-9_-]{11})/,
                /(?:youtube\.com\/watch\?.*v=)([a-zA-Z0-9_-]{11})/
            ];

            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }
            return null;
        }

        function setStatus(text, type) {
            const statusEl = document.getElementById('status');
            statusEl.className = 'status ' + type;
            const icons = {
                loading: '<span class="spinner"></span>',
                downloading: '<i class="fas fa-cloud-download-alt"></i>',
                ready: '<i class="fas fa-check-circle"></i>',
                error: '<i class="fas fa-exclamation-triangle"></i>'
            };
            statusEl.innerHTML = (icons[type] || '') + '<span>' + text + '</span>';
        }

        function fetchThumbnail() {
            const input = document.getElementById('urlInput').value;
            const preview = document.getElementById('preview');
            const fetchBtn = document.getElementById('fetchBtn');

            preview.classList.remove('active');

            if (!input.trim()) {
                setStatus('Pehle YouTube link daalein!', 'error');
                return;
            }

            const videoId = extractVideoId(input);

            if (!videoId) {
                setStatus('Invalid YouTube link. Dobara try karein.', 'error');
                return;
            }

            fetchBtn.disabled = true;

            setStatus('Loading...', 'loading');

            currentThumbUrl = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
            const fallbackUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

            setTimeout(() => {
                setStatus('Downloading...', 'downloading');

                const img = new Image();
                img.crossOrigin = 'anonymous';

                img.onload = function () {
                    if (img.naturalWidth <= 120) {
                        currentThumbUrl = fallbackUrl;
                        const fallbackImg = new Image();
                        fallbackImg.crossOrigin = 'anonymous';
                        fallbackImg.onload = function () {
                            showPreview(fallbackImg.src, videoId, fetchBtn);
                        };
                        fallbackImg.onerror = function () {
                            setStatus('Thumbnail load nahi ho paya.', 'error');
                            fetchBtn.disabled = false;
                        };
                        fallbackImg.src = fallbackUrl;
                    } else {
                        showPreview(img.src, videoId, fetchBtn);
                    }
                };

                img.onerror = function () {
                    setStatus('Thumbnail nahi mila. Link check karein.', 'error');
                    fetchBtn.disabled = false;
                };

                img.src = currentThumbUrl;
            }, 800);
        }

        function showPreview(src, videoId, fetchBtn) {
            setStatus('Ready for Download!', 'ready');

            const thumbImg = document.getElementById('thumbImg');
            thumbImg.src = src;
            thumbImg.dataset.videoId = videoId;

            document.getElementById('preview').classList.add('active');
            fetchBtn.disabled = false;
        }

        async function downloadImage() {
            const img = document.getElementById('thumbImg');
            const videoId = img.dataset.videoId;
            const downloadBtn = document.getElementById('downloadBtn');

            downloadBtn.disabled = true;
            downloadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Downloading...';

            try {
                const response = await fetch(img.src, { mode: 'cors' });
                const blob = await response.blob();

                const imageBitmap = await createImageBitmap(blob);
                const canvas = document.createElement('canvas');
                canvas.width = imageBitmap.width;
                canvas.height = imageBitmap.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(imageBitmap, 0, 0);

                canvas.toBlob((pngBlob) => {
                    const url = URL.createObjectURL(pngBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `youtube-thumbnail-${videoId}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    downloadBtn.disabled = false;
                    downloadBtn.innerHTML = '<i class="fas fa-download"></i> Download PNG';
                }, 'image/png');

            } catch (err) {
                const a = document.createElement('a');
                a.href = img.src;
                a.download = `youtube-thumbnail-${videoId}.jpg`;
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                downloadBtn.disabled = false;
                downloadBtn.innerHTML = '<i class="fas fa-download"></i> Download PNG';
            }
        }

        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') fetchThumbnail();
        });
    </script>
</body>
</html>
