<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>PDF Add & Merge</title>
    <!-- ✅ FAVICON -->
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF-lib + FileSaver (CDN) -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f8f0ff 0%, #f0e6ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* ---------- HOME BUTTON ---------- */
        .home-btn-wrapper {
            position: fixed;
            top: 28px;
            right: 32px;
            z-index: 999;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            color: #6a3de8;
            border: 2px solid #c9b0ff;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(106, 61, 232, 0.15);
            letter-spacing: 0.3px;
        }

        .home-btn:hover {
            background: #6a3de8;
            color: white;
            border-color: #6a3de8;
            transform: translateY(-3px);
            box-shadow: 0 16px 30px rgba(106, 61, 232, 0.4);
        }

        .home-btn i {
            font-size: 1.1rem;
        }

        .card {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 56px 56px 48px 48px;
            padding: 2.6rem 2.8rem 3rem;
            box-shadow: 0 30px 60px -15px rgba(90, 40, 140, 0.25),
                        0 0 0 1px rgba(200, 170, 255, 0.25) inset;
            border: 1px solid rgba(220, 200, 255, 0.4);
            transition: all 0.2s ease;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .brand i {
            font-size: 2.8rem;
            color: #6a3de8;
            filter: drop-shadow(0 4px 8px rgba(106, 61, 232, 0.2));
        }

        .brand h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #2c1a4e;
            letter-spacing: -0.5px;
        }

        .brand h1 small {
            font-size: 0.9rem;
            font-weight: 500;
            background: #ede4ff;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            color: #5b3b9e;
            margin-left: 0.4rem;
        }

        .header-badge {
            background: white;
            border: 1px solid #d9c8ff;
            padding: 0.6rem 1.8rem;
            border-radius: 80px;
            font-weight: 600;
            color: #3b1f7a;
            box-shadow: 0 6px 16px rgba(106, 61, 232, 0.08);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1.1rem;
        }

        .header-badge i {
            color: #6a3de8;
            font-size: 1.2rem;
        }

        /* drop zone */
        .drop-zone {
            background: rgba(245, 238, 255, 0.6);
            border: 2.5px dashed #c9b0ff;
            border-radius: 40px;
            padding: 2.8rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: background 0.25s, border 0.25s, transform 0.15s;
            margin-bottom: 2rem;
            box-shadow: 0 4px 12px rgba(106, 61, 232, 0.06);
        }

        .drop-zone:hover {
            background: #f3ecff;
            border-color: #a884ff;
        }

        .drop-zone:active {
            transform: scale(0.98);
        }

        .drop-zone input {
            display: none;
        }

        .drop-icon {
            font-size: 4rem;
            line-height: 1;
            filter: drop-shadow(0 4px 8px rgba(106, 61, 232, 0.15));
        }

        .drop-text {
            font-size: 1.4rem;
            font-weight: 600;
            color: #2c1a4e;
            margin: 0.6rem 0 0.4rem;
        }

        .drop-hint {
            color: #6a4f9e;
            font-size: 1rem;
            background: #ede4ff;
            display: inline-block;
            padding: 0.3rem 1.8rem;
            border-radius: 30px;
            font-weight: 500;
        }

        /* reorder hint */
        .reorder-hint {
            text-align: center;
            color: #6a4f9e;
            font-size: 0.9rem;
            font-weight: 500;
            margin: 0.8rem 0 0.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: #f3ecff;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid #e0d0ff;
        }

        .reorder-hint i {
            color: #6a3de8;
        }

        /* file list */
        .file-list {
            background: #f8f2ff;
            border-radius: 32px;
            padding: 1rem 1.4rem;
            margin: 0.8rem 0 1.8rem;
            box-shadow: inset 0 2px 6px rgba(106, 61, 232, 0.06);
            border: 1px solid #e0d0ff;
            min-height: 70px;
            max-height: 280px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 0.4rem;
            border-bottom: 1px solid #e7dcff;
            font-size: 1rem;
            color: #2c1a4e;
            cursor: grab;
            transition: background 0.15s, box-shadow 0.15s;
            border-radius: 12px;
            user-select: none;
        }

        .file-item:active {
            cursor: grabbing;
        }

        .file-item.dragging {
            opacity: 0.5;
            background: #ede4ff;
            box-shadow: 0 4px 12px rgba(106, 61, 232, 0.15);
        }

        .file-item.drag-over {
            border-top: 3px solid #6a3de8;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:first-child .drag-handle {
            color: #6a3de8;
        }

        .drag-handle {
            color: #b8a0e0;
            font-size: 1.1rem;
            margin-right: 0.4rem;
            cursor: grab;
            transition: color 0.15s;
        }

        .drag-handle:hover {
            color: #6a3de8;
        }

        .file-name {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 500;
            flex: 1;
            min-width: 0;
        }

        .file-name span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-index {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #6a3de8;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 0.7rem;
            font-weight: 700;
            flex-shrink: 0;
            margin-right: 0.4rem;
        }

        .file-size {
            background: #e7dcff;
            padding: 0.2rem 1.2rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #3b1f7a;
            flex-shrink: 0;
        }

        .remove-file {
            background: none;
            border: none;
            color: #8f6fcf;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0.2rem 0.6rem;
            transition: 0.15s;
            border-radius: 30px;
            line-height: 1;
            flex-shrink: 0;
        }

        .remove-file:hover {
            color: #6a3de8;
            background: #ede4ff;
            transform: scale(1.1);
        }

        /* action buttons */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.8rem;
            justify-content: center;
        }

        .btn {
            border: none;
            background: #ede4ff;
            padding: 1rem 2.4rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.1rem;
            color: #2c1a4e;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            flex: 1 1 auto;
            min-width: 160px;
            box-shadow: 0 6px 14px rgba(106, 61, 232, 0.1);
            border: 1px solid #d9c8ff;
        }

        .btn-primary {
            background: #6a3de8;
            color: white;
            border-color: #7b4cff;
            box-shadow: 0 8px 20px rgba(106, 61, 232, 0.3);
        }

        .btn-primary:hover {
            background: #4a27b0;
            transform: scale(0.97);
            box-shadow: 0 6px 16px rgba(74, 39, 176, 0.35);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.3);
            transform: none;
        }

        .btn-secondary {
            background: #f5f0ff;
            border-color: #d9c8ff;
        }

        .btn-secondary:hover {
            background: #ede4ff;
        }

        /* status */
        .merge-status {
            text-align: center;
            margin-top: 1.4rem;
            font-weight: 500;
            color: #3b1f7a;
            background: #f3ecff;
            padding: 0.8rem 1.2rem;
            border-radius: 60px;
            font-size: 1rem;
            border: 1px solid #e0d0ff;
            transition: 0.2s;
        }

        .merge-status.success {
            background: #d8ebd2;
            border-color: #9fc7a0;
            color: #1c4827;
        }

        .merge-status.error {
            background: #ffe1d6;
            border-color: #e7b6a4;
            color: #7d3f2b;
        }

        .footer-love {
            margin-top: 2.2rem;
            text-align: center;
            font-size: 1rem;
            color: #7a5fa8;
            letter-spacing: 0.3px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .footer-love i {
            color: #6a3de8;
            font-size: 1.1rem;
        }

        /* scroll */
        .file-list::-webkit-scrollbar {
            width: 8px;
        }

        .file-list::-webkit-scrollbar-track {
            background: #ede4ff;
            border-radius: 20px;
        }

        .file-list::-webkit-scrollbar-thumb {
            background: #c9b0ff;
            border-radius: 20px;
        }

        @media (max-width: 600px) {
            .home-btn-wrapper { top: 16px; right: 16px; }
            .home-btn { padding: 8px 18px; font-size: 0.9rem; }
            .card { padding: 1.8rem; }
            .brand h1 { font-size: 1.8rem; }
            .brand i { font-size: 2.2rem; }
            .drop-zone { padding: 2rem 1.2rem; }
            .drop-icon { font-size: 3rem; }
            .drop-text { font-size: 1.2rem; }
            .btn { min-width: 120px; padding: 0.8rem 1.6rem; font-size: 1rem; }
            .header { flex-direction: column; align-items: flex-start; }
            .header-badge { font-size: 0.95rem; padding: 0.4rem 1.2rem; }
            .file-item { font-size: 0.9rem; }
            .file-size { padding: 0.1rem 0.8rem; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

<!-- HOME BUTTON -->
<div class="home-btn-wrapper">
    <a href="index.html" class="home-btn">
        <i class="fas fa-home"></i> Home
    </a>
</div>

<div class="card">
    <!-- header -->
    <div class="header">
        <div class="brand">
            <i class="fas fa-magic"></i>
            <h1>
                PDF Add & Merge
                <small>loved</small>
            </h1>
        </div>
        <div class="header-badge">
            <i class="fas fa-heart" style="color:#6a3de8;"></i> single + multiple
        </div>
    </div>

    <!-- drop zone -->
    <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" multiple accept=".pdf,application/pdf" />
        <div class="drop-icon">📂</div>
        <div class="drop-text">Drop PDFs here or click</div>
        <div class="drop-hint">.pdf only · up to 20 files</div>
    </div>

    <!-- reorder hint -->
    <div class="reorder-hint" id="reorderHint" style="display: none;">
        <i class="fas fa-arrows-alt-v"></i> Drag files up/down to change merge order
    </div>

    <!-- file list -->
    <div class="file-list" id="fileListContainer">
        <div style="color: #9a82bf; text-align: center; padding: 0.8rem 0; font-size: 1rem;">
            no PDFs selected yet
        </div>
    </div>

    <!-- actions -->
    <div class="action-bar">
        <button class="btn btn-secondary" id="clearBtn">🗑️ Clear all</button>
        <button class="btn btn-primary" id="mergeBtn">💜 Merge & Download</button>
    </div>

    <!-- status -->
    <div class="merge-status" id="statusMessage">📌 ready to merge</div>

    <div class="footer-love">
        <i class="fas fa-heart"></i> Made With Love · Create By Sandesh <i class="fas fa-heart"></i>
    </div>
</div>

<script>
    (function() {
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileListContainer = document.getElementById('fileListContainer');
        const mergeBtn = document.getElementById('mergeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusMsg = document.getElementById('statusMessage');
        const reorderHint = document.getElementById('reorderHint');

        let selectedFiles = [];
        let dragIndex = null;

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function updateReorderHint() {
            reorderHint.style.display = selectedFiles.length > 1 ? 'flex' : 'none';
        }

        function renderFileList() {
            if (selectedFiles.length === 0) {
                fileListContainer.innerHTML = `<div style="color: #9a82bf; text-align: center; padding: 0.8rem 0; font-size: 1rem;">no PDFs selected yet</div>`;
                updateReorderHint();
                return;
            }
            let html = '';
            selectedFiles.forEach((file, index) => {
                html += `
                    <div class="file-item" draggable="true" data-index="${index}">
                        <span class="file-name">
                            <i class="fas fa-grip-vertical drag-handle"></i>
                            <span class="file-index">${index + 1}</span>
                            <span>${file.name}</span>
                        </span>
                        <span style="display: flex; align-items: center; gap: 0.8rem;">
                            <span class="file-size">${formatFileSize(file.size)}</span>
                            <button class="remove-file" data-index="${index}" title="remove">✕</button>
                        </span>
                    </div>
                `;
            });
            fileListContainer.innerHTML = html;
            updateReorderHint();

            // Remove buttons
            document.querySelectorAll('.remove-file').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = parseInt(this.dataset.index, 10);
                    if (!isNaN(idx) && idx >= 0 && idx < selectedFiles.length) {
                        selectedFiles.splice(idx, 1);
                        renderFileList();
                        updateStatus('📌 file removed', '');
                    }
                });
            });

            // Drag & drop for reordering
            document.querySelectorAll('.file-item').forEach(item => {
                item.addEventListener('dragstart', function(e) {
                    dragIndex = parseInt(this.dataset.index, 10);
                    this.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', dragIndex);
                });

                item.addEventListener('dragend', function(e) {
                    this.classList.remove('dragging');
                    document.querySelectorAll('.file-item').forEach(el => el.classList.remove('drag-over'));
                });

                item.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    this.classList.add('drag-over');
                });

                item.addEventListener('dragleave', function(e) {
                    this.classList.remove('drag-over');
                });

                item.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.classList.remove('drag-over');
                    const fromIndex = dragIndex !== null ? dragIndex : parseInt(e.dataTransfer.getData('text/plain'), 10);
                    const toIndex = parseInt(this.dataset.index, 10);

                    if (isNaN(fromIndex) || isNaN(toIndex) || fromIndex === toIndex) return;

                    const movedFile = selectedFiles.splice(fromIndex, 1)[0];
                    selectedFiles.splice(toIndex, 0, movedFile);
                    dragIndex = null;
                    renderFileList();
                    updateStatus(`🔄 order updated · ${movedFile.name} moved to position ${toIndex + 1}`, '');
                });
            });
        }

        function updateStatus(text, className = '') {
            statusMsg.textContent = text;
            statusMsg.className = 'merge-status' + (className ? ' ' + className : '');
        }

        function resetStatus() {
            updateStatus('📌 ready to merge', '');
        }

        function addFiles(fileList) {
            let added = 0;
            for (let i = 0; i < fileList.length; i++) {
                const file = fileList[i];
                if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                    const exists = selectedFiles.some(f => f.name === file.name && f.size === file.size);
                    if (!exists) {
                        selectedFiles.push(file);
                        added++;
                    }
                }
            }
            if (added > 0) {
                renderFileList();
                updateStatus(`✅ added ${added} PDF${added > 1 ? 's' : ''}`, '');
            } else {
                updateStatus('⚠️ no new PDFs added (duplicate or invalid)', 'error');
                setTimeout(resetStatus, 2000);
            }
        }

        function clearAll() {
            if (selectedFiles.length === 0) {
                updateStatus('📭 no files to clear', '');
                setTimeout(resetStatus, 1200);
                return;
            }
            selectedFiles = [];
            renderFileList();
            updateStatus('🗑️ all cleared', '');
            setTimeout(resetStatus, 1200);
            fileInput.value = '';
        }

        async function mergeAndDownload() {
            if (selectedFiles.length === 0) {
                updateStatus('❌ no PDFs to merge', 'error');
                return;
            }

            if (selectedFiles.length === 1) {
                try {
                    const singleFile = selectedFiles[0];
                    const buffer = await singleFile.arrayBuffer();
                    const blob = new Blob([buffer], { type: 'application/pdf' });
                    saveAs(blob, singleFile.name.replace('.pdf', '_merged.pdf') || 'merged.pdf');
                    updateStatus(`✅ downloaded: ${singleFile.name}`, 'success');
                    setTimeout(resetStatus, 2500);
                } catch (err) {
                    console.error(err);
                    updateStatus('❌ error downloading single PDF', 'error');
                }
                return;
            }

            try {
                mergeBtn.disabled = true;
                mergeBtn.textContent = '⏳ merging...';
                updateStatus('🔄 merging PDFs...', '');

                const mergedPdf = await PDFLib.PDFDocument.create();
                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    const arrayBuffer = await file.arrayBuffer();
                    const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                    const indices = pdfDoc.getPageIndices();
                    const copiedPages = await mergedPdf.copyPages(pdfDoc, indices);
                    copiedPages.forEach(page => mergedPdf.addPage(page));
                }

                const pdfBytes = await mergedPdf.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                saveAs(blob, 'loved_merged.pdf');

                updateStatus(`💜 merged ${selectedFiles.length} PDFs · downloaded!`, 'success');
                setTimeout(resetStatus, 3000);

            } catch (error) {
                console.error('Merge error:', error);
                updateStatus('❌ merge failed: ' + (error.message || 'unknown error'), 'error');
            } finally {
                mergeBtn.disabled = false;
                mergeBtn.textContent = '💜 Merge & Download';
            }
        }

        // Event listeners
        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                addFiles(e.target.files);
            }
            fileInput.value = '';
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#a884ff';
            dropZone.style.background = '#f3ecff';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = '#c9b0ff';
            dropZone.style.background = 'rgba(245, 238, 255, 0.6)';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#c9b0ff';
            dropZone.style.background = 'rgba(245, 238, 255, 0.6)';
            if (e.dataTransfer.files.length > 0) {
                addFiles(e.dataTransfer.files);
            }
        });

        mergeBtn.addEventListener('click', mergeAndDownload);
        clearBtn.addEventListener('click', clearAll);

        renderFileList();
        console.log('✨ PDF Add & Merge · Sandesh style');
    })();
</script>
</body>
</html>
