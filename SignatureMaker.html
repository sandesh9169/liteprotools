<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signature Maker</title>
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    
    <!-- ✅ 20+ HANDWRITTEN / SIGNATURE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&family=Annie+Use+Your+Telescope&family=Bad+Script&family=Berkshire+Swash&family=Caveat&family=Cedarville+Cursive&family=Covered+By+Your+Grace&family=Dancing+Script&family=Dawning+of+a+New+Day&family=Euphoria+Script&family=Give+You+Glory&family=Gloria+Hallelujah&family=Great+Vibes&family=Handlee&family=Homemade+Apple&family=Indie+Flower&family=Kaushan+Script&family=La+Belle+Aurore&family=Marck+Script&family=Miss+Fajardose&family=Mrs+Saint+Delafield&family=Nanum+Myeongjo&family=Nothing+You+Could+Do&family=Parisienne&family=Playball&family=Reenie+Beanie&family=Sacramento&family=Satisfy&family=Shadows+Into+Light&family=Shadows+Into+Light+Two&family=Sriracha&family=Tangerine&family=The+Girl+Next+Door&family=Zeyada&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-purple: #7c3aed;
            --light-purple-bg: #f3f0ff;
            --border-purple: #d8b4fe;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --btn-shadow: 0 4px 6px -1px rgba(124, 58, 237, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            background-image: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--text-dark);
        }

        .page-header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        .page-header h1 {
            font-size: 28px;
            color: var(--text-dark);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .page-header p.subtitle {
            color: var(--text-light);
            font-size: 15px;
            background: white;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .main-card {
            background: white;
            width: 100%;
            max-width: 900px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05), 0 0 0 1px rgba(124, 58, 237, 0.1);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            background: #f8fafc;
            border-radius: 16px;
            padding: 6px;
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-light);
            transition: all 0.3s ease;
            font-size: 1rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: var(--primary-purple);
            color: white;
            box-shadow: var(--btn-shadow);
        }

        .tab-btn:hover:not(.active) {
            background: #e2e8f0;
            color: var(--text-dark);
        }

        .section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section.active {
            display: block;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
            align-items: center;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .input-group input[type="text"] {
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            width: 200px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input[type="text"]:focus {
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .input-group input[type="number"] {
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            width: 80px;
            font-size: 14px;
            outline: none;
        }

        .color-options {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .color-box {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #e2e8f0;
            transition: transform 0.2s;
        }

        .color-box.white { background: #fff; }
        .color-box.grey { background: #f0f0f0; }
        .color-box.transparent {
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=');
            background-color: #fff;
        }

        .color-box.active {
            border-color: var(--primary-purple);
            transform: scale(1.1);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
        }

        .sig-color-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 10px;
            background: white;
            padding: 5px 12px;
            border-radius: 40px;
            border: 1px solid #e2e8f0;
        }

        .sig-color-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            white-space: nowrap;
        }

        .sig-color-group input[type="color"] {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: none;
            padding: 2px;
        }

        .sig-color-group input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .sig-color-group input[type="color"]::-webkit-color-swatch {
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        .signature-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sig-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .sig-card:hover {
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.1);
            border-color: var(--border-purple);
            transform: translateY(-2px);
        }

        .sig-text {
            font-size: 28px;
            flex-grow: 1;
            text-align: center;
            cursor: pointer;
            padding: 10px;
            border: 2px solid transparent;
            border-radius: 8px;
            transition: all 0.2s;
            word-break: break-all;
            line-height: 1.4;
        }

        .sig-text:hover {
            background: #f8fafc;
        }

        .sig-actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn-download-small {
            background: var(--light-purple-bg);
            color: var(--primary-purple);
            border: 1px solid var(--border-purple);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-download-small:hover {
            background: var(--primary-purple);
            color: white;
            border-color: var(--primary-purple);
        }

        .draw-tools {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
            align-items: center;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tool-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .tool-group input[type="color"] {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: none;
        }

        .tool-group input[type="range"] {
            accent-color: var(--primary-purple);
            cursor: pointer;
            width: 100px;
        }

        #penSizeVal {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-purple);
            min-width: 40px;
        }

        .btn-red {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-red:hover {
            background: #fecaca;
            color: #b91c1c;
        }

        .btn-grey {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-grey:hover {
            background: #e2e8f0;
            color: #1e293b;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 400px;
            background: white;
            border: 2px dashed var(--border-purple);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
        }

        .action-buttons {
            text-align: right;
        }

        .btn-blue {
            background: var(--primary-purple);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            box-shadow: var(--btn-shadow);
        }

        .btn-blue:hover {
            background: #6d28d9;
            transform: translateY(-2px);
        }

        .btn-blue:active {
            transform: scale(0.98);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            position: relative;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #aaa;
            transition: color 0.2s;
        }

        .close:hover {
            color: var(--primary-purple);
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: var(--text-dark);
        }

        .preview-area {
            background: #f8fafc;
            background-image:
                linear-gradient(45deg, #e5e7eb 25%, transparent 25%),
                linear-gradient(-45deg, #e5e7eb 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #e5e7eb 75%),
                linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border: 2px dashed var(--border-purple);
            border-radius: 12px;
            margin: 20px 0;
            padding: 15px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-area img {
            max-width: 100%;
            max-height: 150px;
            object-fit: contain;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 0.9rem;
            background: var(--light-purple-bg);
            padding: 12px 15px;
            border-radius: 10px;
            color: var(--primary-purple);
            font-weight: 500;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            accent-color: var(--primary-purple);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .resize-inputs {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        .input-box label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
        }

        .input-box input {
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            width: 100%;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-box input:focus {
            border-color: var(--primary-purple);
        }

        .full-width {
            width: 100%;
            justify-content: center;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: var(--primary-purple);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        /* ✅ Font count badge */
        .font-badge {
            display: inline-block;
            background: var(--primary-purple);
            color: white;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 700;
        }

        @media (max-width: 700px) {
            .main-card { padding: 20px; }
            .page-header h1 { font-size: 22px; }
            .controls, .draw-tools { flex-direction: column; align-items: flex-start; }
            .sig-card { flex-direction: column; gap: 15px; }
            .sig-actions { width: 100%; justify-content: flex-end; }
            .resize-inputs { flex-direction: column; }
            .canvas-container { height: 300px; }
            .tabs { flex-direction: column; }
            .sig-color-group { margin-left: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="page-header">
        <h1>Signature Maker <span class="font-badge">20+ Fonts</span></h1>
        <p class="subtitle">Free Handwritten Signature Generator · PNG · Transparent</p>
    </div>

    <div class="main-card">
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('text-mode', this)">
                <i class="fas fa-font"></i> Text to Signature
            </button>
            <button class="tab-btn" onclick="switchTab('draw-mode', this)">
                <i class="fas fa-pen"></i> Draw Signature
            </button>
        </div>

        <!-- TEXT MODE -->
        <div id="text-mode" class="section active">
            <div class="controls">
                <div class="input-group">
                    <label>Your Name:</label>
                    <input type="text" id="nameInput" placeholder="Sandesh" value="Sandesh" oninput="generateSignatures()">
                </div>
                <div class="input-group">
                    <label>Font Size (px):</label>
                    <input type="number" id="fontSizeInput" value="32" min="10" max="120" oninput="generateSignatures()">
                </div>
                <div class="input-group">
                    <label>Paper Color:</label>
                    <div class="color-options">
                        <span class="color-box white" onclick="setPaperColor('white', this)" title="White"></span>
                        <span class="color-box grey" onclick="setPaperColor('#f0f0f0', this)" title="Grey"></span>
                        <span class="color-box transparent active" onclick="setPaperColor('transparent', this)" title="Transparent"></span>
                    </div>
                </div>

                <div class="sig-color-group">
                    <label><i class="fas fa-palette" style="color: var(--primary-purple);"></i> Signature Color:</label>
                    <input type="color" id="textSignatureColor" value="#000000" onchange="updateTextSignatureColor()">
                </div>
            </div>
            <div id="signatureContainer" class="signature-list"></div>
        </div>

        <!-- DRAW MODE -->
        <div id="draw-mode" class="section">
            <div class="draw-tools">
                <div class="tool-group">
                    <label>Color:</label>
                    <input type="color" id="penColor" value="#000000" onchange="updateDrawColor()">
                </div>
                <div class="tool-group">
                    <label>Size:</label>
                    <input type="range" id="penSize" min="1" max="10" value="2">
                    <span id="penSizeVal">2px</span>
                </div>
                <div class="tool-group">
                    <button onclick="clearCanvas()" class="btn-red"><i class="fas fa-trash"></i> Clear</button>
                    <button onclick="undoCanvas()" class="btn-grey"><i class="fas fa-undo"></i> Undo</button>
                </div>
            </div>
            <div class="canvas-container" id="canvasContainer">
                <canvas id="signatureCanvas"></canvas>
            </div>
            <div class="action-buttons">
                <button onclick="openDownloadModal('canvas')" class="btn-blue">
                    <i class="fas fa-download"></i> Download Signature
                </button>
            </div>
        </div>
    </div>

    <div class="footer">
        <i class="fa-solid fa-heart"></i> Made with Love · Create by Sandesh <i class="fa-solid fa-heart"></i>
    </div>

    <!-- DOWNLOAD MODAL -->
    <div id="downloadModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3>Download Signature</h3>
            <div class="preview-area">
                <img id="previewImage" src="" alt="Signature Preview">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="resizeCheck" checked onchange="toggleResizeInputs()">
                <label for="resizeCheck">Resize & Compress Signature To Specific Size (Ex. 15kb)</label>
            </div>
            <div class="resize-inputs" id="resizeInputs">
                <div class="input-box">
                    <label>Width (PX)</label>
                    <input type="number" id="dlWidth" value="613">
                </div>
                <div class="input-box">
                    <label>Height (PX)</label>
                    <input type="number" id="dlHeight" value="250">
                </div>
                <div class="input-box">
                    <label>Size (kb)</label>
                    <input type="number" id="dlSize" value="15">
                </div>
            </div>
            <button onclick="downloadFinalImage()" class="btn-blue full-width">
                <i class="fas fa-download"></i> Download Signature (PNG)
            </button>
        </div>
    </div>

    <script>
        /* ================= 20+ HANDWRITTEN / SIGNATURE FONTS ================= */
        const fonts = [
            'Alex Brush',              // Elegant flowing signature
            'Allura',                  // Smooth cursive script
            'Annie Use Your Telescope',// Casual handwriting
            'Bad Script',              // Pen-style cursive
            'Berkshire Swash',         // Decorative handwritten
            'Caveat',                  // Casual marker handwriting
            'Cedarville Cursive',      // Simple cursive handwriting
            'Covered By Your Grace',   // Playful handwriting
            'Dancing Script',          // Popular cursive script
            'Dawning of a New Day',    // Thin elegant script
            'Euphoria Script',         // Modern calligraphy
            'Give You Glory',          // Artistic handwriting
            'Gloria Hallelujah',       // Fun handwriting
            'Great Vibes',             // Classic signature script
            'Handlee',                 // Neat handwriting
            'Homemade Apple',          // Real pen handwriting
            'Indie Flower',            // Friendly handwriting
            'Kaushan Script',          // Brush signature
            'La Belle Aurore',         // Vintage script
            'Marck Script',            // Bold cursive
            'Miss Fajardose',          // Fancy signature
            'Mrs Saint Delafield',     // Elegant signature
            'Nanum Myeongjo',          // Serif handwriting
            'Nothing You Could Do',    // Casual marker
            'Parisienne',              // Romantic script
            'Playball',                // Sports-style signature
            'Reenie Beanie',           // Casual scrawl
            'Sacramento',              // Smooth monoline script
            'Satisfy',                 // Brush signature
            'Shadows Into Light',      // Light handwriting
            'Shadows Into Light Two',  // Variant handwriting
            'Sriracha',                // Casual brush
            'Tangerine',               // Elegant thin script
            'The Girl Next Door',      // Neat girly handwriting
            'Zeyada'                   // Rough pen handwriting
        ];

        let currentDownloadType = 'text';
        let currentSelectedSigElement = null;
        let currentPaperColor = 'transparent';
        let currentTextSignatureColor = '#000000';

        /* ================= TAB SWITCH ================= */
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');

            if (tabId === 'draw-mode') {
                setTimeout(() => {
                    resizeCanvas();
                }, 50);
            }
        }

        /* ================= TEXT TO SIGNATURE ================= */
        const container = document.getElementById('signatureContainer');
        const nameInput = document.getElementById('nameInput');
        const fontSizeInput = document.getElementById('fontSizeInput');

        function updateTextSignatureColor() {
            const colorInput = document.getElementById('textSignatureColor');
            currentTextSignatureColor = colorInput.value;
            document.querySelectorAll('.sig-text').forEach(el => {
                el.style.color = currentTextSignatureColor;
            });
        }

        function generateSignatures() {
            const name = nameInput.value || 'Sandesh';
            const fontSize = fontSizeInput.value || 32;
            container.innerHTML = '';

            fonts.forEach(font => {
                const card = document.createElement('div');
                card.className = 'sig-card';

                const textDiv = document.createElement('div');
                textDiv.className = 'sig-text';
                textDiv.style.fontFamily = `'${font}', cursive`;
                textDiv.style.fontSize = `${fontSize}px`;
                textDiv.style.color = currentTextSignatureColor;
                textDiv.innerText = name;
                textDiv.setAttribute('data-font', font);

                textDiv.onclick = () => {
                    currentSelectedSigElement = textDiv;
                    document.querySelectorAll('.sig-text').forEach(el => el.style.border = '2px solid transparent');
                    textDiv.style.border = '2px solid var(--primary-purple)';
                };

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'sig-actions';

                const dlBtn = document.createElement('button');
                dlBtn.className = 'btn-download-small';
                dlBtn.innerHTML = '<i class="fas fa-download"></i> Download';
                dlBtn.onclick = () => openDownloadModal('text', textDiv, font);

                actionsDiv.appendChild(dlBtn);
                card.appendChild(textDiv);
                card.appendChild(actionsDiv);
                container.appendChild(card);
            });
        }

        function setPaperColor(color, el) {
            currentPaperColor = color;
            document.querySelectorAll('.color-box').forEach(box => box.classList.remove('active'));
            el.classList.add('active');

            document.querySelectorAll('.sig-card').forEach(card => {
                if (color === 'transparent') {
                    card.style.backgroundColor = 'transparent';
                    card.style.backgroundImage = 'none';
                } else {
                    card.style.backgroundColor = color;
                    card.style.backgroundImage = 'none';
                }
            });
        }

        /* ================= DRAW SIGNATURE ================= */
        const canvas = document.getElementById('signatureCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let undoStack = [];
        let canvasInitialized = false;

        function updateDrawColor() {
            const newColor = document.getElementById('penColor').value;
            ctx.strokeStyle = newColor;
        }

        function resizeCanvas() {
            const container = document.getElementById('canvasContainer');
            if (!container) return;

            const w = container.clientWidth;
            const h = container.clientHeight;

            if (w === 0 || h === 0) return;
            if (canvas.width === w && canvas.height === h) return;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width || w;
            tempCanvas.height = canvas.height || h;
            tempCanvas.getContext('2d').drawImage(canvas, 0, 0);

            canvas.width = w;
            canvas.height = h;

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = document.getElementById('penColor').value;
            ctx.lineWidth = document.getElementById('penSize').value;

            if (canvasInitialized) {
                ctx.drawImage(tempCanvas, 0, 0);
            }
            canvasInitialized = true;
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = (e.clientX - rect.left) * (canvas.width / rect.width);
            lastY = (e.clientY - rect.top) * (canvas.height / rect.height);
            saveState();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const currentX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const currentY = (e.clientY - rect.top) * (canvas.height / rect.height);

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(currentX, currentY);
            ctx.strokeStyle = document.getElementById('penColor').value;
            ctx.lineWidth = document.getElementById('penSize').value;
            ctx.stroke();

            lastX = currentX;
            lastY = currentY;
        });

        canvas.addEventListener('mouseup', () => { isDrawing = false; });
        canvas.addEventListener('mouseleave', () => { isDrawing = false; });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length === 0) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            isDrawing = true;
            lastX = (touch.clientX - rect.left) * (canvas.width / rect.width);
            lastY = (touch.clientY - rect.top) * (canvas.height / rect.height);
            saveState();
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isDrawing || e.touches.length === 0) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const currentX = (touch.clientX - rect.left) * (canvas.width / rect.width);
            const currentY = (touch.clientY - rect.top) * (canvas.height / rect.height);

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(currentX, currentY);
            ctx.strokeStyle = document.getElementById('penColor').value;
            ctx.lineWidth = document.getElementById('penSize').value;
            ctx.stroke();

            lastX = currentX;
            lastY = currentY;
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            isDrawing = false;
        }, { passive: false });

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            undoStack = [];
        }

        function undoCanvas() {
            if (undoStack.length > 0) {
                const lastState = undoStack.pop();
                ctx.putImageData(lastState, 0, 0);
            } else {
                clearCanvas();
            }
        }

        function saveState() {
            if (undoStack.length > 20) undoStack.shift();
            try {
                undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            } catch (err) {
                console.warn('Undo state save nahi ho paya:', err);
            }
        }

        document.getElementById('penSize').addEventListener('input', (e) => {
            document.getElementById('penSizeVal').innerText = e.target.value + 'px';
        });

        /* ================= DOWNLOAD MODAL ================= */
        const modal = document.getElementById('downloadModal');
        const previewImage = document.getElementById('previewImage');

        function openDownloadModal(type, element = null, fontName = null) {
            currentDownloadType = type;
            modal.style.display = 'flex';

            if (type === 'text') {
                const name = nameInput.value || 'Sandesh';
                const fontSize = fontSizeInput.value || 32;

                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');

                // ✅ High resolution output
                tempCanvas.width = 1200;
                tempCanvas.height = 400;

                if (currentPaperColor !== 'transparent') {
                    tempCtx.fillStyle = currentPaperColor;
                    tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                }

                // 3x font size for crisp output
                tempCtx.font = `${fontSize * 3}px '${fontName}', cursive`;
                tempCtx.fillStyle = currentTextSignatureColor;
                tempCtx.textAlign = 'center';
                tempCtx.textBaseline = 'middle';
                tempCtx.fillText(name, tempCanvas.width / 2, tempCanvas.height / 2);

                previewImage.src = tempCanvas.toDataURL('image/png');
                window.tempTextCanvas = tempCanvas;

            } else if (type === 'canvas') {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');

                tempCtx.drawImage(canvas, 0, 0);

                previewImage.src = tempCanvas.toDataURL('image/png');
                window.tempDrawCanvas = tempCanvas;
            }
        }

        function closeModal() { modal.style.display = 'none'; }

        function toggleResizeInputs() {
            const isChecked = document.getElementById('resizeCheck').checked;
            document.getElementById('resizeInputs').style.display = isChecked ? 'flex' : 'none';
        }

        async function downloadFinalImage() {
            const isResize = document.getElementById('resizeCheck').checked;
            const targetWidth = parseInt(document.getElementById('dlWidth').value);
            const targetHeight = parseInt(document.getElementById('dlHeight').value);
            const targetSizeKB = parseInt(document.getElementById('dlSize').value);

            let sourceCanvas;
            if (currentDownloadType === 'text') sourceCanvas = window.tempTextCanvas;
            else sourceCanvas = window.tempDrawCanvas;

            if (!sourceCanvas) return;

            let finalCanvas = document.createElement('canvas');
            let finalCtx = finalCanvas.getContext('2d');

            if (isResize) {
                finalCanvas.width = targetWidth;
                finalCanvas.height = targetHeight;

                if (currentPaperColor !== 'transparent') {
                    finalCtx.fillStyle = currentPaperColor;
                    finalCtx.fillRect(0, 0, targetWidth, targetHeight);
                }

                finalCtx.drawImage(sourceCanvas, 0, 0, targetWidth, targetHeight);

                let dataUrl = finalCanvas.toDataURL('image/png');
                let sizeInKB = Math.round((dataUrl.length * 3) / 4 / 1024);

                let scale = 1;
                while (sizeInKB > targetSizeKB && scale > 0.15) {
                    scale -= 0.05;
                    const newW = Math.max(50, Math.round(targetWidth * scale));
                    const newH = Math.max(50, Math.round(targetHeight * scale));

                    const smallCanvas = document.createElement('canvas');
                    smallCanvas.width = newW;
                    smallCanvas.height = newH;
                    const smallCtx = smallCanvas.getContext('2d');

                    if (currentPaperColor !== 'transparent') {
                        smallCtx.fillStyle = currentPaperColor;
                        smallCtx.fillRect(0, 0, newW, newH);
                    }
                    smallCtx.drawImage(sourceCanvas, 0, 0, newW, newH);

                    dataUrl = smallCanvas.toDataURL('image/png');
                    sizeInKB = Math.round((dataUrl.length * 3) / 4 / 1024);

                    finalCanvas = smallCanvas;
                    finalCtx = smallCtx;
                }

                triggerDownload(dataUrl, 'signature.png');
            } else {
                finalCanvas.width = sourceCanvas.width;
                finalCanvas.height = sourceCanvas.height;

                if (currentPaperColor !== 'transparent') {
                    finalCtx.fillStyle = currentPaperColor;
                    finalCtx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
                }

                finalCtx.drawImage(sourceCanvas, 0, 0);
                const dataUrl = finalCanvas.toDataURL('image/png');
                triggerDownload(dataUrl, 'signature.png');
            }

            closeModal();
        }

        function triggerDownload(dataUrl, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        /* ================= INIT ================= */
        window.onload = function () {
            const textColorPicker = document.getElementById('textSignatureColor');
            currentTextSignatureColor = textColorPicker.value;

            generateSignatures();

            document.querySelectorAll('.sig-card').forEach(card => {
                card.style.backgroundColor = 'transparent';
                card.style.backgroundImage = 'none';
            });

            setTimeout(() => {
                if (document.getElementById('draw-mode').classList.contains('active')) {
                    resizeCanvas();
                }
            }, 100);
            document.getElementById('penSizeVal').innerText = document.getElementById('penSize').value + 'px';
        };

        window.addEventListener('resize', () => {
            if (document.getElementById('draw-mode').classList.contains('active')) {
                resizeCanvas();
            }
        });
    </script>
</body>
