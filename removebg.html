<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Background Remover</title>
    <!-- ✅ FAVICON -->
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f8f0ff 0%, #f0e6ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        /* ---------- HOME BUTTON ---------- */
        .home-btn-wrapper {
            position: fixed;
            top: 28px;
            right: 32px;
            z-index: 999;
        }
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            color: #6a3de8;
            border: 2px solid #c9b0ff;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(106, 61, 232, 0.15);
            letter-spacing: 0.3px;
        }
        .home-btn:hover {
            background: #6a3de8;
            color: white;
            border-color: #6a3de8;
            transform: translateY(-3px);
            box-shadow: 0 16px 30px rgba(106, 61, 232, 0.4);
        }
        .home-btn i { font-size: 1.1rem; }

        .card {
            max-width: 960px;
            width: 100%;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 56px 56px 48px 48px;
            padding: 2.8rem 3rem 3.2rem;
            box-shadow: 0 30px 60px -15px rgba(90, 40, 140, 0.25),
                        0 0 0 1px rgba(200, 170, 255, 0.25) inset;
            border: 1px solid rgba(220, 200, 255, 0.4);
            transition: all 0.2s ease;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2.2rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .brand i {
            font-size: 2.8rem;
            color: #6a3de8;
            filter: drop-shadow(0 4px 8px rgba(106, 61, 232, 0.2));
        }

        .brand h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #2c1a4e;
            letter-spacing: -0.5px;
        }

        .brand h1 small {
            font-size: 0.9rem;
            font-weight: 500;
            background: #ede4ff;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            color: #5b3b9e;
            margin-left: 0.4rem;
        }

        .header-badge {
            background: white;
            border: 1px solid #d9c8ff;
            padding: 0.6rem 1.8rem;
            border-radius: 80px;
            font-weight: 600;
            color: #3b1f7a;
            box-shadow: 0 6px 16px rgba(106, 61, 232, 0.08);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1.05rem;
        }

        .header-badge i {
            color: #6a3de8;
            font-size: 1.15rem;
        }

        /* drop zone */
        .drop-zone {
            background: rgba(245, 238, 255, 0.6);
            border: 2.5px dashed #c9b0ff;
            border-radius: 40px;
            padding: 2.6rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: background 0.25s, border 0.25s, transform 0.15s;
            margin-bottom: 1.8rem;
            box-shadow: 0 4px 12px rgba(106, 61, 232, 0.06);
        }

        .drop-zone:hover {
            background: #f3ecff;
            border-color: #a884ff;
            transform: scale(1.005);
        }

        .drop-zone:active {
            transform: scale(0.98);
        }

        .drop-zone input {
            display: none;
        }

        .drop-icon {
            font-size: 3.8rem;
            line-height: 1;
            filter: drop-shadow(0 4px 8px rgba(106, 61, 232, 0.15));
        }

        .drop-text {
            font-size: 1.4rem;
            font-weight: 600;
            color: #2c1a4e;
            margin: 0.5rem 0 0.3rem;
        }

        .drop-hint {
            color: #6a4f9e;
            font-size: 1rem;
            background: #ede4ff;
            display: inline-block;
            padding: 0.3rem 1.8rem;
            border-radius: 30px;
            font-weight: 500;
        }

        /* file preview */
        .file-preview {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.4rem;
            padding: 1.4rem 1.8rem;
            background: #f8f2ff;
            border-radius: 32px;
            border: 1px solid #e0d0ff;
            margin: 1.4rem 0 1.8rem;
            min-height: 80px;
            flex-wrap: wrap;
        }

        .file-preview .preview-image {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            object-fit: cover;
            border: 2px solid #d9c8ff;
            background: #ede4ff;
        }

        .file-preview .file-info {
            flex: 1;
            text-align: left;
        }

        .file-preview .file-info .name {
            font-weight: 600;
            color: #2c1a4e;
            font-size: 1.1rem;
            margin-bottom: 0.15rem;
        }

        .file-preview .file-info .size {
            font-size: 0.9rem;
            color: #7a5fa8;
            margin-bottom: 0.2rem;
        }

        .file-preview .file-info .status {
            font-size: 0.85rem;
            color: #6a3de8;
            font-weight: 500;
        }

        .empty-preview {
            color: #9a82bf;
            text-align: center;
            padding: 0.8rem 0;
            font-size: 1rem;
            width: 100%;
        }

        /* result section */
        .result-section {
            display: none;
            margin: 1.4rem 0 1.8rem;
            padding: 1.6rem;
            background: #f8f2ff;
            border-radius: 32px;
            border: 2px solid #10b981;
            text-align: center;
        }

        .result-section.show {
            display: block;
        }

        .result-section .result-image {
            max-width: 100%;
            max-height: 420px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(106, 61, 232, 0.15);
            border: 2px solid #d9c8ff;
        }

        .result-section .result-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            color: #10b981;
            font-weight: 700;
            margin-bottom: 1rem;
            font-size: 1.15rem;
        }

        .result-section .result-label i {
            font-size: 1.4rem;
        }

        /* progress bar */
        .progress-container {
            display: none;
            margin: 1.4rem 0;
            padding: 1.1rem 1.8rem;
            background: #f8f2ff;
            border-radius: 60px;
            border: 1px solid #e0d0ff;
        }

        .progress-container.show {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #ede4ff;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 0.6rem;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6a3de8, #a884ff);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            color: #3b1f7a;
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* actions */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
            justify-content: center;
        }

        .btn {
            border: none;
            padding: 1rem 2.2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.05rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            flex: 1 1 auto;
            min-width: 160px;
            box-shadow: 0 6px 14px rgba(106, 61, 232, 0.1);
            border: 1px solid #d9c8ff;
        }

        .btn-primary {
            background: #6a3de8;
            color: white;
            border-color: #7b4cff;
            box-shadow: 0 8px 20px rgba(106, 61, 232, 0.3);
        }

        .btn-primary:hover {
            background: #4a27b0;
            transform: scale(0.97);
            box-shadow: 0 6px 16px rgba(74, 39, 176, 0.35);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        .btn-success {
            background: #10b981;
            color: white;
            border-color: #34d399;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover {
            background: #059669;
            transform: scale(0.97);
        }

        .btn-success:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        .btn-secondary {
            background: #f5f0ff;
            border-color: #d9c8ff;
            color: #3b1f7a;
        }

        .btn-secondary:hover {
            background: #ede4ff;
        }

        /* status */
        .status-msg {
            text-align: center;
            margin-top: 1.4rem;
            font-weight: 500;
            color: #3b1f7a;
            background: #f3ecff;
            padding: 0.9rem 1.2rem;
            border-radius: 60px;
            font-size: 1rem;
            border: 1px solid #e0d0ff;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
        }

        .status-msg.success {
            background: #d8ebd2;
            border-color: #9fc7a0;
            color: #1c4827;
        }

        .status-msg.error {
            background: #ffe1d6;
            border-color: #e7b6a4;
            color: #7d3f2b;
        }

        .status-msg.info {
            background: #dbeafe;
            border-color: #93c5fd;
            color: #1e40af;
        }

        .footer-love {
            margin-top: 2.4rem;
            text-align: center;
            font-size: 1rem;
            color: #7a5fa8;
            letter-spacing: 0.3px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.7rem;
            flex-wrap: wrap;
        }

        .footer-love i {
            color: #6a3de8;
            font-size: 1.1rem;
        }

        @media (max-width: 600px) {
            .home-btn-wrapper { top: 16px; right: 16px; }
            .home-btn { padding: 8px 18px; font-size: 0.9rem; }
            .card { padding: 1.8rem; }
            .brand h1 { font-size: 1.8rem; }
            .brand i { font-size: 2.2rem; }
            .drop-zone { padding: 2rem 1.2rem; }
            .drop-icon { font-size: 3rem; }
            .drop-text { font-size: 1.15rem; }
            .btn { min-width: 130px; padding: 0.8rem 1.6rem; font-size: 0.95rem; }
            .header { flex-direction: column; align-items: flex-start; }
            .header-badge { font-size: 0.9rem; padding: 0.4rem 1.2rem; }
            .file-preview { flex-direction: column; text-align: center; }
            .file-preview .file-info { text-align: center; }
        }
    </style>
</head>
<body>

<!-- HOME BUTTON -->
<div class="home-btn-wrapper">
    <a href="index.html" class="home-btn">
        <i class="fas fa-home"></i> Home
    </a>
</div>

<div class="card">
    <!-- header -->
    <div class="header">
        <div class="brand">
            <i class="fas fa-eraser"></i>
            <h1>
                Background Remover
                <small>AI powered</small>
            </h1>
        </div>
        <div class="header-badge">
            <i class="fas fa-magic"></i> remove.bg
        </div>
    </div>

    <!-- drop zone -->
    <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/*" />
        <div class="drop-icon">🖼️</div>
        <div class="drop-text">Drop image here or click</div>
        <div class="drop-hint">PNG · JPEG · JPG · WebP · GIF</div>
    </div>

    <!-- file preview -->
    <div class="file-preview" id="filePreview">
        <div class="empty-preview">
            <i class="fas fa-heart" style="margin-right: 6px;"></i> no image selected yet
        </div>
    </div>

    <!-- progress -->
    <div class="progress-container" id="progressContainer">
        <div class="progress-text">
            <span><i class="fas fa-spinner fa-pulse"></i> Removing background...</span>
            <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- result -->
    <div class="result-section" id="resultSection">
        <div class="result-label">
            <i class="fas fa-check-circle"></i>
            <span>Background Removed!</span>
        </div>
        <img id="resultImage" class="result-image" src="" alt="Result" />
    </div>

    <!-- actions -->
    <div class="actions">
        <button class="btn btn-secondary" id="resetBtn"><i class="fas fa-undo-alt"></i> Reset</button>
        <button class="btn btn-primary" id="removeBtn"><i class="fas fa-magic"></i> Remove Background</button>
        <button class="btn btn-success" id="downloadBtn" disabled><i class="fas fa-download"></i> Download</button>
    </div>

    <!-- status -->
    <div class="status-msg" id="statusMsg">
        <i class="fas fa-circle-info"></i>
        <span>Ready · upload an image to remove background</span>
    </div>

    <div class="footer-love">
        <i class="fas fa-heart"></i> Made with Love · Create by Sandesh <i class="fas fa-heart"></i>
    </div>
</div>

<script>
    (function() {
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const filePreview = document.getElementById('filePreview');
        const removeBtn = document.getElementById('removeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusMsg = document.getElementById('statusMsg');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const resultSection = document.getElementById('resultSection');
        const resultImage = document.getElementById('resultImage');

        let currentFile = null;
        let resultBlobUrl = null;

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
        }

        function updateStatus(text, className = '') {
            statusMsg.innerHTML = text;
            statusMsg.className = 'status-msg' + (className ? ' ' + className : '');
        }

        function resetStatus() {
            if (currentFile) {
                updateStatus(`<i class="fas fa-file-image" style="color:#6a3de8;"></i> ${currentFile.name} · ready to remove background`, '');
            } else {
                updateStatus('<i class="fas fa-circle-info"></i> Ready · upload an image to remove background', '');
            }
        }

        function showFilePreview(file) {
            if (!file) {
                filePreview.innerHTML = `
                    <div class="empty-preview">
                        <i class="fas fa-heart" style="margin-right: 6px;"></i> no image selected yet
                    </div>
                `;
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const imgSrc = e.target.result;
                filePreview.innerHTML = `
                    <img src="${imgSrc}" class="preview-image" alt="preview" />
                    <div class="file-info">
                        <div class="name"><i class="fas fa-image" style="color:#6a3de8; margin-right:6px;"></i>${file.name}</div>
                        <div class="size">${formatFileSize(file.size)}</div>
                        <div class="status"><i class="fas fa-check-circle" style="color:#10b981;"></i> ready to process</div>
                    </div>
                `;
            };
            reader.readAsDataURL(file);
        }

        function resetAll() {
            currentFile = null;
            fileInput.value = '';
            showFilePreview(null);
            resultSection.classList.remove('show');
            resultImage.src = '';
            downloadBtn.disabled = true;
            downloadBtn.innerHTML = '<i class="fas fa-download"></i> Download';
            progressContainer.classList.remove('show');
            progressFill.style.width = '0%';
            progressPercent.textContent = '0%';
            if (resultBlobUrl) {
                URL.revokeObjectURL(resultBlobUrl);
                resultBlobUrl = null;
            }
            removeBtn.disabled = false;
            removeBtn.innerHTML = '<i class="fas fa-magic"></i> Remove Background';
            resetStatus();
        }

        function handleFile(file) {
            if (file && file.type.startsWith('image/')) {
                currentFile = file;
                showFilePreview(file);
                resultSection.classList.remove('show');
                resultImage.src = '';
                downloadBtn.disabled = true;
                downloadBtn.innerHTML = '<i class="fas fa-download"></i> Download';
                progressContainer.classList.remove('show');
                progressFill.style.width = '0%';
                progressPercent.textContent = '0%';
                if (resultBlobUrl) {
                    URL.revokeObjectURL(resultBlobUrl);
                    resultBlobUrl = null;
                }
                removeBtn.disabled = false;
                removeBtn.innerHTML = '<i class="fas fa-magic"></i> Remove Background';
                resetStatus();
            } else {
                updateStatus('<i class="fas fa-exclamation-triangle" style="color:#fda085;"></i> please select an image file', 'error');
                setTimeout(resetStatus, 2000);
            }
        }

        // --- drop zone events ---
        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
            fileInput.value = '';
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.background = '#f3ecff';
            dropZone.style.borderColor = '#a884ff';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.background = 'rgba(245, 238, 255, 0.6)';
            dropZone.style.borderColor = '#c9b0ff';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.background = 'rgba(245, 238, 255, 0.6)';
            dropZone.style.borderColor = '#c9b0ff';
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        // --- reset ---
        resetBtn.addEventListener('click', resetAll);

        // --- simulate progress ---
        function simulateProgress() {
            progressContainer.classList.add('show');
            progressFill.style.width = '0%';
            progressPercent.textContent = '0%';
            let progress = 0;
            const interval = setInterval(() => {
                progress += 5 + Math.random() * 8;
                if (progress > 100) progress = 100;
                progressFill.style.width = progress + '%';
                progressPercent.textContent = Math.round(progress) + '%';
                if (progress >= 100) clearInterval(interval);
            }, 250);
            return interval;
        }

        // --- remove background ---
        removeBtn.addEventListener('click', async () => {
            if (!currentFile) {
                updateStatus('<i class="fas fa-exclamation-circle" style="color:#fda085;"></i> Please upload an image first', 'error');
                setTimeout(resetStatus, 2000);
                return;
            }

            removeBtn.disabled = true;
            removeBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Processing...';
            updateStatus('<i class="fas fa-spinner fa-pulse" style="color:#6a3de8;"></i> Removing background...', 'info');

            const progressInterval = simulateProgress();

            const formData = new FormData();
            formData.append("image_file", currentFile);
            formData.append("size", "auto");

            try {
                const response = await fetch("https://api.remove.bg/v1.0/removebg", {
                    method: "POST",
                    headers: {
                        "X-Api-Key": "P3LkGVuv64atKzEgGh9Ds6cW"
                    },
                    body: formData
                });

                clearInterval(progressInterval);
                progressFill.style.width = '100%';
                progressPercent.textContent = '100%';

                if (!response.ok) {
                    throw new Error("Background removal failed! Please try again.");
                }

                const blob = await response.blob();
                if (resultBlobUrl) {
                    URL.revokeObjectURL(resultBlobUrl);
                }
                resultBlobUrl = URL.createObjectURL(blob);
                resultImage.src = resultBlobUrl;
                resultSection.classList.add('show');
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = '<i class="fas fa-download"></i> Download';

                updateStatus('<i class="fas fa-check-circle" style="color:#10b981;"></i> Background removed successfully!', 'success');
                setTimeout(resetStatus, 2500);

            } catch (error) {
                clearInterval(progressInterval);
                progressContainer.classList.remove('show');
                updateStatus(`<i class="fas fa-times-circle" style="color:#fda085;"></i> ${error.message}`, 'error');
                setTimeout(resetStatus, 3000);
            } finally {
                removeBtn.disabled = false;
                removeBtn.innerHTML = '<i class="fas fa-magic"></i> Remove Background';
                setTimeout(() => {
                    progressContainer.classList.remove('show');
                }, 1000);
            }
        });

        // --- download ---
        downloadBtn.addEventListener('click', function() {
            if (!resultBlobUrl) {
                updateStatus('<i class="fas fa-exclamation-circle" style="color:#fda085;"></i> No result to download', 'error');
                setTimeout(resetStatus, 2000);
                return;
            }
            const link = document.createElement('a');
            link.href = resultBlobUrl;
            const baseName = currentFile ? currentFile.name.replace(/\.[^.]+$/, '') : 'image';
            link.download = baseName + '_background_removed.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            updateStatus('<i class="fas fa-download" style="color:#10b981;"></i> Download started!', 'success');
            setTimeout(resetStatus, 2000);
        });

        // --- init ---
        resetAll();
        console.log('✨ Background Remover · Sandesh style');
    })();
</script>
</body>
</html>
